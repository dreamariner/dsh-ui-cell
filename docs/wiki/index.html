}

/* ===== popover/popover.css ===== */
.duk-popover-root {
  display: inline-flex;
}

.duk-popover-trigger {
  display: inline-flex;
  cursor: pointer;
}

.duk-popover-content {
  position: fixed;
  z-index: 1100;
  min-width: 160px;
  max-width: min(360px, var(--dsh-anchored-max-width, 360px));
  max-height: var(--dsh-anchored-max-height, 70vh);
  overflow: auto;
  box-sizing: border-box;
  padding: 10px 12px;
  border: 0.5px solid var(--dsw-alias-border-l4);
  border-radius: var(--dsw-radius-md);
  background: var(--dsw-alias-bg-layer-2);
  box-shadow: var(--dsw-shadow-lv2);
  font: var(--dsw-font-s-14);
  color: var(--dsw-alias-label-primary);
}

/* ===== combobox/combobox.css ===== */
.duk-combobox-root {
  display: inline-flex;
  position: relative;
  width: 100%;
}

.duk-combobox-disabled {
  opacity: 0.5;
  pointer-events: none;
}

.duk-combobox-wrap {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  box-sizing: border-box;
  width: 100%;
  height: 32px;
  padding: 0 8px;
  border: 0.5px solid var(--dsw-alias-border-l4);
  border-radius: var(--dsw-radius-md);
  background: var(--dsw-alias-bg-layer-1);
  cursor: pointer;
}

.duk-combobox-wrap:focus-within {
  border-color: var(--dsw-alias-state-business-primary);
}

.duk-combobox-input {
  flex: 1 1 0;
  min-width: 0;
  border: none;
  outline: none;
  background: transparent;
  font: var(--dsw-font-s-14);
  color: var(--dsw-alias-label-primary);
}

.duk-combobox-input::placeholder {
  color: var(--dsw-alias-label-tertiary);
}

.duk-combobox-chevron {
  flex: none;
  color: var(--dsw-alias-label-tertiary);
}

.duk-combobox-list {
  position: fixed;
  z-index: 1100;
  box-sizing: border-box;
  max-height: var(--dsh-anchored-max-height, 320px);
  overflow: auto;
  padding: 4px;
  border: 0.5px solid var(--dsw-alias-border-l4);
  border-radius: var(--dsw-radius-md);
  background: var(--dsw-alias-bg-layer-2);
  box-shadow: var(--dsw-shadow-lv2);
}

.duk-combobox-option {
  display: block;
  width: 100%;
  padding: 6px 8px;
  border: none;
  border-radius: var(--dsw-radius-sm);
  background: transparent;
  cursor: pointer;
  text-align: left;
  font: var(--dsw-font-s-14);
  color: var(--dsw-alias-label-primary);
}

.duk-combobox-option:hover,
.duk-combobox-option[data-active] {
  background: var(--dsw-alias-interactive-bg-hover);
}

.duk-combobox-option[aria-selected='true'] {
  color: var(--dsw-alias-brand-primary);
  font-weight: 500;
}

.duk-combobox-none {
  padding: 10px 8px;
  font: var(--dsw-font-xs-13);
  color: var(--dsw-alias-label-tertiary);
  text-align: center;
}

/* ===== command/command.css ===== */
.duk-command {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.duk-command-input {
  box-sizing: border-box;
  width: 100%;
  height: 32px;
  padding: 0 8px;
  border: 0.5px solid var(--dsw-alias-border-l4);
  border-radius: var(--dsw-radius-md);
  outline: none;
  background: var(--dsw-alias-bg-layer-1);
  font: var(--dsw-font-s-14);
  color: var(--dsw-alias-label-primary);
}

.duk-command-input:focus {
  border-color: var(--dsw-alias-state-business-primary);
}

.duk-command-input::placeholder {
  color: var(--dsw-alias-label-tertiary);
}

.duk-command-list {
  display: flex;
  flex-direction: column;
  gap: 1px;
  max-height: 280px;
  overflow: auto;
}

.duk-command-item {
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: space-between;
  padding: 6px 8px;
  border: none;
  border-radius: var(--dsw-radius-sm);
  background: transparent;
  cursor: pointer;
  text-align: left;
  font: var(--dsw-font-s-14);
  color: var(--dsw-alias-label-primary);
}

.duk-command-item:hover,
.duk-command-item[data-active] {
  background: var(--dsw-alias-interactive-bg-hover);
}

.duk-command-label {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.duk-command-hint {
  flex: none;
  font: var(--dsw-font-xs-13);
  color: var(--dsw-alias-label-tertiary);
}

.duk-command-none {
  padding: 14px 8px;
  font: var(--dsw-font-xs-13);
  color: var(--dsw-alias-label-tertiary);
  text-align: center;
}

/* ===== context-menu/context-menu.css ===== */
.duk-context-menu-root {
  display: inline-flex;
}

/* ===== menubar/menubar.css ===== */
.duk-menubar {
  display: inline-flex;
  gap: 2px;
  align-items: center;
}

.duk-menubar-entry {
  padding: 4px 10px;
  border: none;
  border-radius: var(--dsw-radius-sm);
  background: transparent;
  cursor: pointer;
  font: var(--dsw-font-s-14);
  color: var(--dsw-alias-label-secondary);
}

.duk-menubar-entry:hover,
.duk-menubar-entry[data-open] {
  background: var(--dsw-alias-interactive-bg-hover);
  color: var(--dsw-alias-label-primary);
}

/* ===== sheet/sheet.css ===== */
.duk-sheet-root {
  position: fixed;
  z-index: 1000;
  inset: 0;
  display: flex;
  pointer-events: auto;
}

.duk-sheet-root[data-side='right'] { justify-content: flex-end; }
.duk-sheet-root[data-side='left'] { justify-content: flex-start; }
.duk-sheet-root[data-side='bottom'] { flex-direction: column; justify-content: flex-end; }
.duk-sheet-root[data-side='top'] { flex-direction: column; justify-content: flex-start; }

.duk-sheet-mask {
  position: absolute;
  inset: 0;
  background: var(--dsw-alias-bg-mask-1);
  backdrop-filter: var(--dsw-mask-blur);
}

.duk-sheet-panel {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  box-sizing: border-box;
  min-width: 0;
  background: var(--dsw-alias-bg-layer-2);
  box-shadow: var(--dsw-elevation-prominent);
  animation: duk-sheet-sheet-in 160ms var(--ds-ease-in-out);
}

.duk-sheet-root[data-side='right'] .duk-sheet-panel { height: 100%; border-left: 0.5px solid var(--dsw-alias-border-l4); }
.duk-sheet-root[data-side='left'] .duk-sheet-panel { height: 100%; border-right: 0.5px solid var(--dsw-alias-border-l4); }
.duk-sheet-root[data-side='bottom'] .duk-sheet-panel { width: 100%; max-height: 70vh; border-top: 0.5px solid var(--dsw-alias-border-l4); border-radius: var(--dsw-radius-panel) var(--dsw-radius-panel) 0 0; }
.duk-sheet-root[data-side='top'] .duk-sheet-panel { width: 100%; max-height: 70vh; border-bottom: 0.5px solid var(--dsw-alias-border-l4); border-radius: 0 0 var(--dsw-radius-panel) var(--dsw-radius-panel); }

.duk-sheet-header {
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 0.5px solid var(--dsw-alias-border-l4);
}

.duk-sheet-title {
  font: var(--dsw-font-m-18);
  color: var(--dsw-alias-label-primary);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.duk-sheet-close {
  display: inline-flex;
  flex: none;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border: none;
  border-radius: var(--dsw-radius-sm);
  background: transparent;
  cursor: pointer;
  color: var(--dsw-alias-label-secondary);
}

.duk-sheet-close:hover {
  background: var(--dsw-alias-interactive-bg-hover);
}

.duk-sheet-body {
  flex: 1 1 0;
  min-height: 0;
  overflow: auto;
  padding: 16px;
  scrollbar-width: thin;
  scrollbar-color: var(--dsw-alias-scrollbar-bg-l2) transparent;
}

.duk-sheet-footer {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  padding: 12px 16px;
  border-top: 0.5px solid var(--dsw-alias-border-l4);
}

@keyframes duk-sheet-sheet-in {
  from { opacity: 0; transform: translateX(24px); }
  to { opacity: 1; transform: none; }
}

.duk-sheet-root[data-side='bottom'] .duk-sheet-panel { animation-name: duk-sheet-sheet-up; }
.duk-sheet-root[data-side='top'] .duk-sheet-panel { animation-name: duk-sheet-sheet-down; }
.duk-sheet-root[data-side='left'] .duk-sheet-panel { animation-name: duk-sheet-sheet-left; }

@keyframes duk-sheet-sheet-up {
  from { opacity: 0; transform: translateY(32px); }
  to { opacity: 1; transform: none; }
}

@keyframes duk-sheet-sheet-down {
  from { opacity: 0; transform: translateY(-32px); }
  to { opacity: 1; transform: none; }
}

@keyframes duk-sheet-sheet-left {
  from { opacity: 0; transform: translateX(-24px); }
  to { opacity: 1; transform: none; }
}

@media (prefers-reduced-motion: reduce) {
  .duk-sheet-panel { animation: none; }
}

/* ===== navigation-menu/navigation-menu.css ===== */
.duk-navigation-menu-nav {
  display: flex;
  gap: 2px;
  align-items: center;
}

.duk-navigation-menu-item {
  position: relative;
  display: inline-flex;
  padding: 6px 10px;
  border: none;
  border-radius: var(--dsw-radius-sm);
  background: transparent;
  cursor: pointer;
  font: var(--dsw-font-s-14);
  color: var(--dsw-alias-label-secondary);
  text-decoration: none;
}

.duk-navigation-menu-item:hover {
  background: var(--dsw-alias-interactive-bg-hover);
  color: var(--dsw-alias-label-primary);
}

.duk-navigation-menu-item[data-current] {
  color: var(--dsw-alias-label-primary);
  font-weight: 500;
}

.duk-navigation-menu-item[data-current]::after {
  content: '';
  position: absolute;
  left: 10px;
  right: 10px;
  bottom: 0;
  height: 2px;
  border-radius: 1px;
  background: var(--dsw-alias-brand-primary);
}

/* ===== pagination/pagination.css ===== */
.duk-pagination {
  display: inline-flex;
  gap: 4px;
  align-items: center;
}

.duk-pagination-navButton,
.duk-pagination-pageButton {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 28px;
  height: 28px;
  padding: 0 6px;
  border: 0.5px solid var(--dsw-alias-border-l4);
  border-radius: var(--dsw-radius-sm);
  background: var(--dsw-alias-bg-layer-1);
  cursor: pointer;
  font: var(--dsw-font-s-14);
  color: var(--dsw-alias-label-primary);
}

.duk-pagination-navButton:disabled {
  opacity: 0.4;
  cursor: default;
}

.duk-pagination-navButton:hover:not(:disabled),
.duk-pagination-pageButton:hover:not([aria-current='page']) {
  background: var(--dsw-alias-interactive-bg-hover);
}

.duk-pagination-pageButton[aria-current='page'] {
  border-color: var(--dsw-alias-brand-primary);
  background: var(--dsw-alias-brand-primary);
  color: var(--dsw-alias-label-primary-foreground);
  font-weight: 500;
  cursor: default;
}

.duk-pagination-ellipsis {
  min-width: 20px;
  text-align: center;
  color: var(--dsw-alias-label-tertiary);
  user-select: none;
}

/* ===== slider/slider.css ===== */
.duk-slider {
  appearance: none;
  width: 100%;
  height: 4px;
  margin: 0;
  border-radius: var(--dsw-radius-sm);
  background: var(--dsw-alias-bg-skeleton);
  outline: none;
  cursor: pointer;
}

.duk-slider::-webkit-slider-thumb {
  appearance: none;
  width: 14px;
  height: 14px;
  border: none;
  border-radius: 50%;
  background: var(--dsw-alias-brand-primary);
  cursor: grab;
}

.duk-slider::-webkit-slider-thumb:active {
  cursor: grabbing;
}

.duk-slider::-moz-range-thumb {
  width: 14px;
  height: 14px;
  border: none;
  border-radius: 50%;
  background: var(--dsw-alias-brand-primary);
  cursor: grab;
}

.duk-slider:focus-visible {
  outline: 2px solid var(--dsw-alias-state-business-primary);
  outline-offset: 2px;
}

/* ===== radio-group/radio-group.css ===== */
.duk-radio-group-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.duk-radio-group-group[data-orientation='horizontal'] {
  flex-direction: row;
  gap: 16px;
}

.duk-radio-group-option {
  display: inline-flex;
  gap: 8px;
  align-items: center;
  cursor: pointer;
  user-select: none;
}

.duk-radio-group-input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
}

.duk-radio-group-dot {
  display: inline-flex;
  flex: none;
  width: 14px;
  height: 14px;
  box-sizing: border-box;
  align-items: center;
  justify-content: center;
  border: 0.5px solid var(--dsw-alias-border-l3);
  border-radius: 50%;
  background: var(--dsw-alias-bg-layer-1);
  transition: border-color 120ms ease;
}

.duk-radio-group-dot::after {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--dsw-alias-brand-primary);
  opacity: 0;
  transform: scale(0.4);
  transition: opacity 120ms ease, transform 120ms ease;
}

.duk-radio-group-input:checked + .duk-radio-group-dot {
  border-color: var(--dsw-alias-brand-primary);
}

.duk-radio-group-input:checked + .duk-radio-group-dot::after {
  opacity: 1;
  transform: none;
}

.duk-radio-group-input:focus-visible + .duk-radio-group-dot {
  outline: 2px solid var(--dsw-alias-state-business-primary);
  outline-offset: 2px;
}

.duk-radio-group-input:disabled + .duk-radio-group-dot {
  opacity: 0.5;
}

.duk-radio-group-label {
  font: var(--dsw-font-s-14);
  color: var(--dsw-alias-label-primary);
}

/* ===== input-otp/input-otp.css ===== */
.duk-input-otp-root {
  position: relative;
  display: inline-flex;
  gap: 6px;
  cursor: text;
}

.duk-input-otp-cell {
  display: inline-flex;
  width: 32px;
  height: 36px;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  border: 0.5px solid var(--dsw-alias-border-l4);
  border-radius: var(--dsw-radius-md);
  background: var(--dsw-alias-bg-layer-1);
  font: var(--dsw-font-m-18);
  font-variant-numeric: tabular-nums;
  color: var(--dsw-alias-label-primary);
}

.duk-input-otp-cell[data-filled] {
  border-color: var(--dsw-alias-border-l3);
}

.duk-input-otp-cell[data-active] {
  border-color: var(--dsw-alias-state-business-primary);
}

.duk-input-otp-cell[data-active]::after {
  content: '';
  width: 1px;
  height: 18px;
  background: var(--dsw-alias-state-business-primary);
  animation: duk-input-otp-otp-caret 1s steps(2) infinite;
}

.duk-input-otp-input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
  outline: none;
  background: transparent;
  color: transparent;
  caret-color: transparent;
  font-size: 16px;
}

.duk-input-otp-disabled {
  opacity: 0.5;
  pointer-events: none;
}

@keyframes duk-input-otp-otp-caret {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0; }
}

@media (prefers-reduced-motion: reduce) {
  .duk-input-otp-cell[data-active]::after { animation: none; }
}

/* ===== calendar/calendar.css ===== */
.duk-calendar {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 12px;
  box-sizing: border-box;
  width: 252px;
  border: 0.5px solid var(--dsw-alias-border-l4);
  border-radius: var(--dsw-radius-md);
  background: var(--dsw-alias-bg-layer-2);
}

.duk-calendar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.duk-calendar-monthLabel {
  font: var(--dsw-font-s-14);
  font-weight: 500;
  color: var(--dsw-alias-label-primary);
}

.duk-calendar-nav {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border: none;
  border-radius: var(--dsw-radius-sm);
  background: transparent;
  cursor: pointer;
  color: var(--dsw-alias-label-secondary);
}

.duk-calendar-nav:hover {
  background: var(--dsw-alias-interactive-bg-hover);
  color: var(--dsw-alias-label-primary);
}

.duk-calendar-chevronRight {
  transform: rotate(90deg);
}

.duk-calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
}

.duk-calendar-weekday {
  padding: 4px 0;
  font: var(--dsw-font-xs-13);
  color: var(--dsw-alias-label-tertiary);
  text-align: center;
}

.duk-calendar-cell {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 28px;
  padding: 0;
  border: none;
  border-radius: var(--dsw-radius-sm);
  background: transparent;
  cursor: pointer;
  font: var(--dsw-font-s-14);
  font-variant-numeric: tabular-nums;
  color: var(--dsw-alias-label-primary);
}

.duk-calendar-cell:hover:not(:disabled) {
  background: var(--dsw-alias-interactive-bg-hover);
}

.duk-calendar-cell[data-today] {
  color: var(--dsw-alias-brand-primary);
  font-weight: 500;
}

.duk-calendar-cell[data-selected] {
  background: var(--dsw-alias-brand-primary);
  color: var(--dsw-alias-label-primary-foreground);
  font-weight: 500;
}

.duk-calendar-cell:disabled {
  opacity: 0.35;
  cursor: default;
}

/* ===== date-picker/date-picker.css ===== */
.duk-date-picker-trigger {
  display: inline-flex;
  gap: 6px;
  align-items: center;
  box-sizing: border-box;
  width: 100%;
  height: 32px;
  padding: 0 8px;
  border: 0.5px solid var(--dsw-alias-border-l4);
  border-radius: var(--dsw-radius-md);
  background: var(--dsw-alias-bg-layer-1);
  cursor: pointer;
  font: var(--dsw-font-s-14);
}

.duk-date-picker-trigger:hover {
  background: var(--dsw-alias-interactive-bg-hover);
}

.duk-date-picker-trigger:disabled {
  opacity: 0.5;
  cursor: default;
}

.duk-date-picker-value {
  flex: 1 1 0;
  min-width: 0;
  text-align: left;
  color: var(--dsw-alias-label-primary);
  font-variant-numeric: tabular-nums;
}

.duk-date-picker-placeholder {
  flex: 1 1 0;
  min-width: 0;
  text-align: left;
  color: var(--dsw-alias-label-tertiary);
}

.duk-date-picker-chevron {
  flex: none;
  color: var(--dsw-alias-label-tertiary);
}

/* ===== carousel/carousel.css ===== */
.duk-carousel {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.duk-carousel-trackRow {
  display: flex;
  gap: 8px;
  align-items: center;
}

.duk-carousel-track {
  display: flex;
  gap: 12px;
  flex: 1 1 0;
  min-width: 0;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
  padding: 2px;
}

.duk-carousel-track::-webkit-scrollbar {
  display: none;
}

.duk-carousel-slide {
  flex: none;
  width: 240px;
  scroll-snap-align: start;
}

.duk-carousel-arrow {
  display: inline-flex;
  flex: none;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border: 0.5px solid var(--dsw-alias-border-l4);
  border-radius: 50%;
  background: var(--dsw-alias-bg-layer-1);
  cursor: pointer;
  color: var(--dsw-alias-label-primary);
}

.duk-carousel-arrow:hover:not(:disabled) {
  background: var(--dsw-alias-interactive-bg-hover);
}

.duk-carousel-arrow:disabled {
  opacity: 0.4;
  cursor: default;
}

.duk-carousel-dots {
  display: flex;
  gap: 4px;
  justify-content: center;
}

.duk-carousel-dot {
  width: 6px;
  height: 6px;
  padding: 0;
  border: none;
  border-radius: 50%;
  background: var(--dsw-alias-border-l3);
  cursor: pointer;
}

.duk-carousel-dot[data-current] {
  background: var(--dsw-alias-brand-primary);
}

/* ===== resizable/resizable.css ===== */
.duk-resizable {
  display: flex;
  width: 100%;
  min-height: 0;
}

.duk-resizable-pane {
  flex: 1 1 0;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
}

.duk-resizable-divider {
  flex: none;
  width: 5px;
  cursor: col-resize;
  background: transparent;
  position: relative;
}

.duk-resizable-divider::after {
  content: '';
  position: absolute;
  inset: 0 2px;
  border-radius: var(--dsw-radius-sm);
  background: var(--dsw-alias-border-l4);
  transition: background 120ms ease;
}

.duk-resizable-divider:hover::after,
.duk-resizable-divider:active::after {
  background: var(--dsw-alias-brand-primary);
}

/* ===== sidebar/sidebar.css ===== */
.duk-sidebar {
  display: flex;
  flex-direction: column;
  flex: none;
  height: 100%;
  box-sizing: border-box;
  border-right: 0.5px solid var(--dsw-alias-border-l4);
  background: var(--dsw-alias-bg-layer-1);
  transition: width 160ms ease;
  overflow: hidden;
}

.duk-sidebar-header {
  flex: none;
  padding: 12px;
  border-bottom: 0.5px solid var(--dsw-alias-border-l4);
}

.duk-sidebar-content {
  flex: 1 1 0;
  min-height: 0;
  overflow-y: auto;
  padding: 8px;
  scrollbar-width: thin;
  scrollbar-color: var(--dsw-alias-scrollbar-bg-l2) transparent;
}

.duk-sidebar-footer {
  flex: none;
  padding: 12px;
  border-top: 0.5px solid var(--dsw-alias-border-l4);
}

@media (prefers-reduced-motion: reduce) {
  .duk-sidebar { transition: none; }
}

/* ===== chart/chart.css ===== */
.duk-chart-barChart {
  display: flex;
  gap: 6px;
  align-items: flex-end;
  width: 100%;
}

.duk-chart-barSlot {
  display: flex;
  flex: 1 1 0;
  flex-direction: column;
  gap: 4px;
  height: 100%;
  min-width: 0;
  align-items: center;
  justify-content: flex-end;
}

.duk-chart-bar {
  width: 100%;
  max-width: 28px;
  border-radius: var(--dsw-radius-sm) var(--dsw-radius-sm) 0 0;
  background: var(--dsw-alias-brand-primary);
  opacity: 0.85;
  transition: opacity 120ms ease;
}

.duk-chart-barSlot:hover .duk-chart-bar {
  opacity: 1;
}

.duk-chart-barLabel {
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font: var(--dsw-font-xs-13);
  color: var(--dsw-alias-label-tertiary);
}

.duk-chart-lineChart,
.duk-chart-sparkline {
  width: 100%;
  overflow: visible;
}

.duk-chart-line {
  fill: none;
  stroke: var(--dsw-alias-brand-primary);
  stroke-width: 1.5;
  stroke-linejoin: round;
  stroke-linecap: round;
}

/* ===== form/form.css ===== */
.duk-form {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.duk-form[data-pending] {
  opacity: 0.6;
  pointer-events: none;
}

/* ===== json-tree/json-tree.css ===== */
.duk-json-tree-root {
  --json-tree-property: #881391;
  --json-tree-string: #c41a16;
  --json-tree-number: #1c00cf;
  --json-tree-keyword: #1c00cf;
  --json-tree-punctuation: #202124;
  --json-tree-icon: #5f6368;
  --json-tree-hover: rgb(60 64 67 / 4%);

  min-width: 0;
  overflow: auto;
  position: relative;
  color: var(--dsw-alias-label-primary);
  background: var(--dsw-alias-bg-layer-1);
  font: 12px/16px var(--ds-font-family-code);
  overscroll-behavior-x: contain;
  overscroll-behavior-y: auto;
}

:global(body[data-ds-dark-theme]) .duk-json-tree-root {
  --json-tree-property: #5db0d7;
  --json-tree-string: #f28b82;
  --json-tree-number: #99c8ff;
  --json-tree-keyword: #99c8ff;
  --json-tree-punctuation: #e8eaed;
  --json-tree-icon: #9aa0a6;
  --json-tree-hover: rgb(232 234 237 / 5%);
}

.duk-json-tree-container {
  box-sizing: border-box;
  width: 100%;
  min-width: 0;
  margin: 0;
  padding: 6px 8px 8px 8px;
  white-space: pre;
}

.duk-json-tree-expandedTopLevel {
  box-sizing: border-box;
  width: 100%;
  min-width: 0;
  padding: 6px 8px 8px 14px;
}

.duk-json-tree-expandedTopLevel:has(> .duk-json-tree-topLevelBracket[data-json-root-row][data-json-copy-active]) {
  background: var(--json-tree-hover);
}

@media (hover: hover) {
  .duk-json-tree-expandedTopLevel:has(> .duk-json-tree-topLevelBracket[data-json-root-row]:hover) {
    background: var(--json-tree-hover);
  }
}

.duk-json-tree-expandedTopLevelContainer {
  padding: 0;
}

.duk-json-tree-row.duk-json-tree-topLevelBracket {
  margin-left: 0;
  padding-left: 0;
}

.duk-json-tree-children {
  margin: 0;
  padding: 0;
  list-style: none;
}

.duk-json-tree-row {
  position: relative;
  box-sizing: border-box;
  min-width: 0;
  min-height: 16px;
  margin: 0;
  padding: 0 0 0 10px;
  list-style: none;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.duk-json-tree-row:not(.duk-json-tree-topLevelBracket)[data-json-copy-active]::after,
.duk-json-tree-row:has(> .duk-json-tree-expander:focus-visible)::after {
  position: absolute;
  z-index: 0;
  top: 0;
  right: 0;
  left: 0;
  height: var(--json-tree-row-height, 16px);
  background: var(--json-tree-hover);
  content: '';
  pointer-events: none;
}

@media (hover: hover) {
  .duk-json-tree-row:not(.duk-json-tree-topLevelBracket):hover:not(:has(.duk-json-tree-row:hover))::after {
    position: absolute;
    z-index: 0;
    top: 0;
    right: 0;
    left: 0;
    height: var(--json-tree-row-height, 16px);
    background: var(--json-tree-hover);
    content: '';
    pointer-events: none;
  }
}

.duk-json-tree-row > span:not(.duk-json-tree-expander, .duk-json-tree-copySlot) {
  position: relative;
  z-index: 1;
}

.duk-json-tree-label {
  margin-right: 3px;
  color: var(--json-tree-property);
  font-weight: 400;
}

.duk-json-tree-clickableLabel {
  cursor: pointer;
}

.duk-json-tree-stringValue {
  color: var(--json-tree-string);
}

.duk-json-tree-stringField {
  position: relative;
  z-index: 1;
  display: flow-root;
}

.duk-json-tree-stringText {
  display: block;
  max-height: calc(var(--json-tree-collapsed-lines) * 16px);
  padding-left: 12px;
  overflow: hidden;
  text-indent: -12px;
  word-break: break-all;
}

.duk-json-tree-stringRaw {
  margin: 4px 0 0 12px;
  overflow: auto;
  color: var(--dsw-alias-label-primary);
  font: inherit;
  overflow-wrap: normal;
  white-space: pre;
  word-break: normal;
}

.duk-json-tree-stringActions {
  position: absolute;
  top: 1px;
  right: 4px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 4px;
  width: fit-content;
  height: 16px;
}

.duk-json-tree-stringRaw[data-wrap='true'] {
  overflow-wrap: anywhere;
  white-space: pre-wrap;
  word-break: break-all;
}

.duk-json-tree-stringActions > .duk-json-tree-copySlot {
  opacity: 1;
  pointer-events: auto;
}

.duk-json-tree-stringToggleSlot {
  display: flex;
  float: right;
  align-items: flex-end;
  height: calc(var(--json-tree-collapsed-lines) * 16px);
  margin-left: 2px;
  shape-outside: inset(calc((var(--json-tree-collapsed-lines) - 1) * 16px) 0 0);
  pointer-events: none;
}

.duk-json-tree-stringToggle {
  display: inline-flex;
  align-items: baseline;
  gap: 2px;
  margin: 0;
  padding: 0;
  border: 0;
  color: var(--dsw-alias-label-secondary);
  background: transparent;
  font: inherit;
  text-indent: 0;
  white-space: nowrap;
  cursor: pointer;
  pointer-events: auto;
}

@media (hover: hover) {
  .duk-json-tree-stringToggle:hover {
    color: var(--dsw-alias-label-primary);
  }
}

.duk-json-tree-stringToggle:focus-visible {
  outline: 1px solid var(--dsw-focus-ring-color, var(--dsw-alias-state-business-primary));
  outline-offset: 1px;
}

.duk-json-tree-row:has(> .duk-json-tree-stringField) {
  --json-tree-row-height: 100%;
}

.duk-json-tree-summary {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.duk-json-tree-numberValue {
  color: var(--json-tree-number);
}

.duk-json-tree-keywordValue {
  color: var(--json-tree-keyword);
}

.duk-json-tree-otherValue {
  color: var(--dsw-alias-label-secondary);
}

.duk-json-tree-punctuation {
  color: var(--json-tree-punctuation);
}

.duk-json-tree-preview {
  color: var(--json-tree-punctuation);
}

.duk-json-tree-previewProperty {
  color: var(--json-tree-punctuation);
}

.duk-json-tree-previewEllipsis {
  color: var(--dsw-alias-label-tertiary);
}

.duk-json-tree-copySlot {
  display: inline-flex;
  width: 20px;
  height: 16px;
  opacity: 0;
  pointer-events: none;
}

.duk-json-tree-row > .duk-json-tree-copySlot {
  position: absolute;
  z-index: 2;
  top: 0;
  right: 0;
}

.duk-json-tree-row:has(> .duk-json-tree-stringField) > .duk-json-tree-copySlot {
  top: auto;
  bottom: 0;
}

.duk-json-tree-row:has(> .duk-json-tree-copySlot) > .duk-json-tree-stringField .duk-json-tree-stringToggleSlot {
  padding-right: 24px;
}

.duk-json-tree-row[data-json-copy-active] > .duk-json-tree-copySlot,
.duk-json-tree-copySlot:focus-within {
  opacity: 1;
  pointer-events: auto;
}

@media (hover: hover) {
  .duk-json-tree-row:hover:not(:has(.duk-json-tree-row:hover)) > .duk-json-tree-copySlot {
    opacity: 1;
    pointer-events: auto;
  }
}

.duk-json-tree-actionButton {
  box-sizing: border-box;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 16px;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: var(--dsw-radius-xs);
  color: var(--dsw-alias-label-secondary);
  background: transparent;
  cursor: pointer;
}

@media (hover: hover) {
  .duk-json-tree-actionButton:hover {
    color: var(--dsw-alias-label-primary);
  }
}

.duk-json-tree-actionButton[aria-pressed='true'] {
  color: var(--dsw-alias-state-business-primary);
}

.duk-json-tree-actionButton:focus-visible {
  outline: 1px solid var(--dsw-focus-ring-color, var(--dsw-alias-state-business-primary));
  outline-offset: -1px;
}

.duk-json-tree-actionButton[data-state='failed'] {
  color: var(--dsw-alias-state-error-primary);
}

.duk-json-tree-expander {
  position: absolute;
  z-index: 2;
  top: 0;
  left: 0;
  display: inline-flex;
  align-items: center;
  justify-content: flex-start;
  box-sizing: border-box;
  width: 8px;
  height: 16px;
  margin: 0;
  color: var(--json-tree-icon);
  cursor: pointer;
  user-select: none;
}

.duk-json-tree-expander::before {
  width: 0;
  height: 0;
  border-top: 4px solid transparent;
  border-bottom: 4px solid transparent;
  border-left: 6px solid currentColor;
  content: '';
  transform: scale(0.75);
  transform-origin: 33.333% center;
}

.duk-json-tree-collapseIcon::before {
  transform: rotate(90deg) scale(0.75);
}

@media (hover: hover) {
  .duk-json-tree-expander:hover {
    color: var(--dsw-alias-label-primary);
  }
}

.duk-json-tree-expander:focus-visible {
  outline: none;
}

.duk-json-tree-collapsedContent {
  margin: 0 1px;
  color: var(--json-tree-punctuation);
  cursor: pointer;
}

.duk-json-tree-collapsedContent::after {
  content: '…';
}

@media (hover: none) {
  .duk-json-tree-copySlot { opacity: 1; pointer-events: auto; }

  .duk-json-tree-row:has(> .duk-json-tree-copySlot) { padding-right: 24px; }
}

/* ===== json-block/json-block.css ===== */
.duk-json-block-root {
  margin: 4px 0;
}

.duk-json-block-toggle {
  font-size: 12px;
  line-height: 18px;
  color: var(--dsw-alias-label-secondary);
  padding: 2px 6px;
  border: none;
  background: transparent;
  cursor: pointer;
  border-radius: var(--dsw-radius-sm);
}

@media (hover: hover) {
  .duk-json-block-toggle:hover {
    background: var(--dsw-alias-interactive-bg-hover);
  }
}

.duk-json-block-body {
  margin: 4px 0 0;
  padding: 8px;
  max-height: 200px;
  overflow: auto;
  background: var(--dsw-alias-markdown-code-block);
  border: 0.5px solid var(--dsw-alias-border-l1);
  border-radius: var(--dsw-radius-lg);
  font-family: var(--ds-font-family-code);
  font-size: 11px;
  line-height: 16px;
  color: var(--dsw-alias-label-primary);
}

/* ===== search-block/search-block.css ===== */
.duk-search-block-block {
  --dsl-search-radius: var(--dsw-radius-lg);
  --dsl-search-line-height: 22px;

  position: relative;
  margin: 16px 0;
  color: var(--dsw-alias-label-primary);
  background: var(--dsw-alias-markdown-code-block);
  border-radius: var(--dsl-search-radius);
}

.duk-search-block-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 14px;
  background: var(--dsw-alias-markdown-code-block-banner);
  border-top-left-radius: var(--dsl-search-radius);
  border-top-right-radius: var(--dsl-search-radius);
}

.duk-search-block-summary {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font: var(--dsw-font-xs-13);
  color: var(--dsw-alias-label-secondary);
}

.duk-search-block-copyButton {
  flex: none;
  background-color: transparent;
  border: none;
  padding: 0;
  margin: 0;
  color: var(--dsw-alias-label-secondary);
  cursor: pointer;
  font: var(--dsw-font-xs-13);
}

.duk-search-block-body {
  padding: 8px 14px 12px 0;
  font: var(--dsw-font-markdown-code-block);
  overflow-x: auto;
  overflow-y: hidden;
}

/* No wrapping: a match line or a path keeps its content on one row and scrolls
   sideways instead of folding. */
.duk-search-block-line {
  min-height: var(--dsl-search-line-height);
  padding-left: 14px;
  white-space: pre;
}

/* The 1-based line number ahead of a grep match line, dimmed so the match text
   stays the salient content. */
.duk-search-block-lineNumber {
  color: var(--dsw-alias-label-tertiary);
}

/* A file group's header: a bold path label plus its match count, the whole row
   the collapse control. */
.duk-search-block-fileHeader {
  display: flex;
  align-items: baseline;
  gap: 8px;
  width: 100%;
  min-height: var(--dsl-search-line-height);
  padding: 0 14px;
  border: none;
  background-color: transparent;
  cursor: pointer;
  font: inherit;
  text-align: left;
}

.duk-search-block-filePath {
  min-width: 0;
  font-weight: 600;
  color: var(--dsw-alias-label-primary);
  white-space: pre;
}

.duk-search-block-fileCount {
  flex: none;
  color: var(--dsw-alias-label-tertiary);
}

.duk-search-block-expand {
  display: block;
  width: 100%;
  padding: 0 14px;
  border: none;
  background-color: transparent;
  color: var(--dsw-alias-label-tertiary);
  cursor: pointer;
  font: inherit;
  text-align: left;
}

@media (hover: hover) {
  .duk-search-block-expand:hover {
    color: var(--dsw-alias-label-secondary);
  }
}

.duk-search-block-empty {
  padding: 12px 14px;
  font: var(--dsw-font-markdown-code-block);
  color: var(--dsw-alias-label-tertiary);
}

/* ===== code-toolbar/code-card.css ===== */
.duk-code-toolbar-card {
  position: relative;
  margin: 16px 0;
  color: var(--dsw-alias-label-primary);
  background: var(--dsw-alias-markdown-code-block);
  border-radius: var(--dsw-radius-lg);
  font: var(--dsw-font-markdown-code-block);
}

.duk-code-toolbar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 18px 8px 22px;
  background: var(--dsl-code-block-background, var(--dsw-alias-markdown-code-block));
  border-top-left-radius: inherit;
  border-top-right-radius: inherit;
  color: var(--dsw-alias-label-secondary);
  font: 11px/18px var(--dsw-font-family);
}

.duk-code-toolbar-heading {
  display: flex;
  align-items: baseline;
  gap: 12px;
  min-width: 0;
}

.duk-code-toolbar-language {
  color: var(--dsw-alias-label-tertiary);
  flex: none;
  font-family: var(--ds-font-family-code);
}

.duk-code-toolbar-title {
  color: var(--dsw-alias-label-tertiary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.duk-code-toolbar-actions {
  display: flex;
  align-items: center;
  gap: 4px;
  flex: none;
}

.duk-code-toolbar-status {
  margin-right: 8px;
  color: var(--dsw-alias-label-tertiary);
  white-space: nowrap;
}

.duk-code-toolbar-action {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  padding: 0;
  border: 0;
  border-radius: var(--dsw-radius-sm);
  color: var(--dsw-alias-label-secondary);
  background: transparent;
  cursor: pointer;
}

@media (hover: hover) {
  .duk-code-toolbar-action:hover {
    background: var(--dsw-alias-interactive-bg-hover);
  }
}

.duk-code-toolbar-action:focus-visible {
  outline: 1px solid var(--dsw-focus-ring-color, var(--dsw-alias-state-business-primary));
  outline-offset: 2px;
}

.duk-code-toolbar-body {
  padding: 6px 22px 20px;
  font: var(--dsw-font-markdown-code-block);
  overflow-x: auto;
}

/* ===== diff-block/diff-block.css ===== */
.duk-diff-block-block {
  overflow: hidden;
}

.duk-diff-block-body {
  display: grid;
  grid-template-columns: minmax(max-content, 1fr);
  padding: 6px 0 20px;
  font: var(--dsw-font-markdown-code-block);
  overflow-x: auto;
}

.duk-diff-block-line {
  box-sizing: border-box;
  min-height: 1lh;
  padding: 0 22px;
  white-space: pre;
}

.duk-diff-block-block[data-code-wrap='true'] .duk-diff-block-body {
  grid-template-columns: minmax(0, 1fr);
}

.duk-diff-block-block[data-code-wrap='true'] .duk-diff-block-line {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.duk-diff-block-path {
  color: var(--dsw-alias-label-secondary);
  font-weight: 500;
}

.duk-diff-block-gap {
  color: var(--dsw-alias-label-tertiary);
}

.duk-diff-block-del::before {
  content: '- ';
}

.duk-diff-block-del {
  color: var(--dsw-alias-state-error-primary);
  background: var(--dsw-alias-code-diff-deleted);
  box-shadow: inset 3px 0 0 var(--dsw-alias-state-error-primary);
}

.duk-diff-block-add::before {
  content: '+ ';
}

.duk-diff-block-add {
  color: var(--dsw-alias-state-success-primary);
  background: var(--dsw-alias-code-diff-added);
  box-shadow: inset 3px 0 0 var(--dsw-alias-state-success-primary);
}

.duk-diff-block-context {
  color: var(--dsw-alias-label-secondary);
}

.duk-diff-block-context::before {
  content: '  ';
}

.duk-diff-block-expand {
  display: block;
  width: 100%;
  padding: 0 22px;
  border: none;
  background: transparent;
  color: var(--dsw-alias-label-tertiary);
  cursor: pointer;
  font: inherit;
  text-align: left;
}

@media (hover: hover) {
  .duk-diff-block-expand:hover {
    color: var(--dsw-alias-label-secondary);
  }
}

/* ===== terminal-block/terminal-block.css ===== */
.duk-terminal-block-block {
  --dsl-terminal-radius: var(--dsw-radius-lg);
  --dsl-terminal-line-height: 22px;
  /* Rebindable by consumers (CodeBlock's --dsl-code-block-content-font
     pattern): a surface wanting the smaller code size rebinds this together
     with --dsl-terminal-line-height on its own container. */
  --dsl-terminal-font: var(--dsw-font-markdown-code-block);
  /* The card's own left inset, holding the run-state dot in a column of its own
     so it never competes with the commands for horizontal space. */
  --dsl-terminal-gutter: 30px;

  position: relative;
  margin: 16px 0;
  /* The gutter is the card's OWN padding, not a margin: every consumer rewrites
     `margin` wholesale (each render site sets its own indent), which silently
     cancelled the reservation and let the dot fall outside the card into a
     container that clips it. Owning the reservation here keeps the invariant
     with the component that depends on it. */
  padding-left: var(--dsl-terminal-gutter);
  color: var(--dsw-alias-label-primary);
  background: var(--dsw-alias-markdown-code-block);
  border-radius: var(--dsl-terminal-radius);
  /* Clip the banner to the card's own radius: when a consumer adds a border,
     the banner's equal corner radius no longer nests inside it and leaves a
     notch at the corner. Nothing inside renders out of the box. */
  overflow: hidden;
}

/* The status pill and copy control top-align to the FIRST prompt row (their
   heights are capped to the prompt line, so on a multi-line command they sit
   with the first command instead of floating mid-banner). */
.duk-terminal-block-header {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  /* Pulled back across the card's gutter padding so the banner spans the FULL
     surface, then re-inset by the same amount so the prompt text and the dot
     keep their positions. The banner shares the card's own surface (no banner
     token): the l2 divider below is the section boundary. */
  margin-left: calc(-1 * var(--dsl-terminal-gutter));
  padding: 9px 14px 9px var(--dsl-terminal-gutter);
  border-top-left-radius: var(--dsl-terminal-radius);
  border-top-right-radius: var(--dsl-terminal-radius);
  /* A long multi-line command scrolls inside the banner (same cap as the
     IN/OUT card's sections) instead of pushing the output off screen. */
  max-height: 150px;
  overflow-y: auto;
}

/* Banner scrollbar floats off the card edge like the output's. */
.duk-terminal-block-header::-webkit-scrollbar-thumb {
  border: 2px solid transparent;
  background-clip: padding-box;
  border-radius: var(--dsw-radius-sm);
}

.duk-terminal-block-header::-webkit-scrollbar-track {
  margin: 6px;
}

/* Full-width l2 hairline between the command banner and the body — the same
   divider the IN/OUT card draws between its sections. A banner-only card (a
   running command that has printed nothing yet) draws none. */
.duk-terminal-block-block[data-body] .duk-terminal-block-header {
  border-bottom: 0.5px solid var(--dsw-alias-border-l2);
}

/* One row per command line. The prompt column is the only element allowed to
   shrink; the status pill and the copy control keep their intrinsic width. */
.duk-terminal-block-prompt {
  display: flex;
  flex-direction: column;
  min-width: 0;
  flex: 1;
  font: var(--dsl-terminal-font);
}

.duk-terminal-block-promptLine {
  position: relative;
  display: flex;
  align-items: baseline;
  gap: 8px;
  min-width: 0;
  line-height: var(--dsl-terminal-line-height);
}

/* Out of flow inside the card's own gutter padding, so the reservation and the
   dot move together and no consumer margin can pull them apart; the dot neither
   indents its command nor depends on the command's text metrics to line up.
   Centered against the first visual line box, not the code font's baseline. */
.duk-terminal-block-runState {
  position: absolute;
  left: calc(-1 * var(--dsl-terminal-gutter) + 8px);
  top: calc(var(--dsl-terminal-line-height) / 2);
  transform: translateY(-50%);
}

/* The dot is aria-hidden; this is its text label for assistive technology. */
.duk-terminal-block-runStateLabel {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.duk-terminal-block-cwd {
  flex: none;
  color: var(--dsw-alias-label-tertiary);
}

/* Each authored command line scrolls independently of its prompt and status.
   `pre` preserves whitespace; hosts can opt into wrapping with `pre-wrap`. */
.duk-terminal-block-command {
  --dsl-command-whitespace: var(--dsl-terminal-command-whitespace, pre);
  color: var(--dsw-alias-label-primary);
}

/* Capped to the prompt's line height (Pill's own 24px height would exceed a
   smaller-font prompt row and stretch the banner). Sticky against the
   banner's own scroll so the pill and the copy control stay in reach while a
   long command scrolls underneath. */
.duk-terminal-block-status {
  flex: none;
  position: sticky;
  top: 0;
  height: var(--dsl-terminal-line-height);
  color: var(--dsw-alias-state-error-primary);
}

.duk-terminal-block-copyButton {
  flex: none;
  position: sticky;
  top: 0;
  /* Card surface, not transparent: the control is sticky over the banner's
     own scroll, so scrolled command text must not bleed through it. */
  background-color: var(--dsw-alias-markdown-code-block);
  border: none;
  padding: 0;
  margin: 0;
  color: var(--dsw-alias-label-secondary);
  cursor: pointer;
  font: var(--dsw-font-xs-13);
  line-height: var(--dsl-terminal-line-height);
}

/* Vertical scrolling lives on the OUTPUT, not the card root: a root scroller
   would run its scrollbar over the banner (and the copy control), while here
   the banner stays pinned and the bar sits inside the output's right padding.
   Unset, the max-height is none and the auto overflow never engages. */
.duk-terminal-block-output {
  max-height: var(--dsl-terminal-output-max-height, none);
  padding: 12px 14px 12px 0;
  font: var(--dsl-terminal-font);
  overflow-x: auto;
  overflow-y: auto;
}

/* Both output scrollbars (vertical cap, horizontal pre overflow) float 2px
   off the card edge: a transparent border clips the thumb inward so it never
   hugs the rounded corner. */
.duk-terminal-block-output::-webkit-scrollbar-thumb {
  border: 2px solid transparent;
  background-clip: padding-box;
  border-radius: var(--dsw-radius-sm);
}

/* Track end-margins keep the thumb's travel out of the card's rounded
   corners in both directions. */
.duk-terminal-block-output::-webkit-scrollbar-track {
  margin: 6px;
}

/* Default `pre`: alignment is the payload of terminal output. Hosts opt
   into wrapping long lines by rebinding the variable to `pre-wrap`, which
   also keeps the output region from ever scrolling sideways; overflow-wrap
   is inert while white-space stays `pre`. */
.duk-terminal-block-line {
  min-height: var(--dsl-terminal-line-height);
  white-space: var(--dsl-terminal-line-whitespace, pre);
  overflow-wrap: anywhere;
}

.duk-terminal-block-expand {
  display: block;
  width: 100%;
  padding: 0;
  border: none;
  background-color: transparent;
  color: var(--dsw-alias-label-tertiary);
  cursor: pointer;
  font: inherit;
  text-align: left;
}

@media (hover: hover) {
  .duk-terminal-block-expand:hover {
    color: var(--dsw-alias-label-secondary);
  }
}

.duk-terminal-block-empty {
  padding: 12px 14px 12px 0;
  font: var(--dsl-terminal-font);
  color: var(--dsw-alias-label-tertiary);
}

</style>
<style>
/* ===== 文档站骨架（自带样式，不占组件命名空间） ===== */
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; color: #1f2328; background: #f6f7f8; }
.doc-shell { display: flex; min-height: 100vh; }
.doc-side { width: 240px; flex: none; border-right: 1px solid #e4e6ea; background: #fff; padding: 16px 12px; position: sticky; top: 0; height: 100vh; overflow: auto; }
.doc-side h1 { font-size: 15px; margin: 4px 8px 2px; }
.doc-side .ver { font-size: 11px; color: #8b949e; margin: 0 8px 14px; }
.doc-side a { display: block; padding: 5px 10px; border-radius: 6px; color: #57606a; text-decoration: none; font-size: 13px; }
.doc-side a:hover { background: #eef0f2; color: #1f2328; }
.doc-side .group { font-size: 11px; color: #8b949e; margin: 14px 8px 4px; letter-spacing: 0.05em; }
.doc-main { flex: 1 1 0; min-width: 0; padding: 28px 40px 80px; max-width: 980px; }
.doc-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.doc-top h2 { margin: 0; font-size: 20px; }
.doc-top button { margin-left: auto; padding: 5px 12px; border: 1px solid #d0d4da; border-radius: 6px; background: #fff; cursor: pointer; font-size: 12px; }
.doc-intro { color: #57606a; font-size: 13px; line-height: 1.7; margin: 0 0 24px; }
.demo-section { background: #fff; border: 1px solid #e4e6ea; border-radius: 10px; padding: 18px 20px 20px; margin-bottom: 18px; scroll-margin-top: 16px; }
.demo-section > h3 { margin: 0 0 2px; font-size: 15px; }
.demo-section .desc { margin: 0 0 12px; color: #8b949e; font-size: 12px; line-height: 1.6; }
.demo-stage { border: 1px dashed #d8dce1; border-radius: 8px; padding: 20px; margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
.demo-stage > * { margin: 0; }
.demo-code { margin: 0; padding: 12px 14px; background: #0d1117; color: #c9d1d9; border-radius: 8px; font: 12px/1.6 'SF Mono', Menlo, Consolas, monospace; overflow: auto; white-space: pre; }
body[data-ds-dark-theme] .doc-side, body[data-ds-dark-theme] .demo-section { background: #16181d; border-color: #2a2d33; }
body[data-ds-dark-theme] { background: #0f1114; color: #e6e8eb; }
body[data-ds-dark-theme] .doc-side a { color: #9ea7b3; }
body[data-ds-dark-theme] .doc-side a:hover { color: #e6e8eb; background: #1e2127; }
body[data-ds-dark-theme] .doc-top button { background: #1e2127; border-color: #33383f; color: #e6e8eb; }
body[data-ds-dark-theme] .demo-stage { border-color: #33383f; }
body[data-ds-dark-theme] .demo-section .desc, body[data-ds-dark-theme] .doc-intro { color: #9ea7b3; }
</style>

.duk-tag {
  display: inline-flex;
  align-items: center;
  border-radius: 999px;
  corner-shape: round;
  padding: 1px 8px;
  font-size: 11px;
  line-height: 17px;
  font-weight: 500;
  white-space: nowrap;
}

.duk-tag[data-tone='outline'] {
  border: 0.5px solid var(--dsw-alias-border-l4);
  color: var(--dsw-alias-label-tertiary);
}

.duk-tag[data-tone='solid'] {
  background: var(--dsw-alias-label-primary);
  color: var(--dsw-alias-bg-layer-3);
}

.duk-tag[data-tone='neutral'] {
  background: var(--dsw-alias-bg-module-platform);
  color: var(--dsw-alias-label-secondary);

.duk-tag[data-tone='quiet'] {

.duk-tag[data-tone='success'] {

/* Compact translucent dropdown card shared by feature menus. */
.duk-menu-list,
.duk-menu-submenu {
  /* min-widths below are the design's outer card widths \u2014 include the pad. */
  box-sizing: border-box;
  padding: 4px;
  display: flex;
  flex-direction: column;
  gap: 0;
  border: 0;
  --dsw-elevation-stroke-color: var(--dsw-alias-border-l1);
  box-shadow: var(--dsw-elevation-prominent);
  /* Elevated surface: the scrollbar thumb takes the l2 elevation tokens. The
     declaration sits on the card rather than on \`.scrollable .viewport\`
     because the elevation is a property of this surface, and the custom
     properties inherit down to whichever descendant actually scrolls (see
     ui-theme styles/scrollbar.css for the rebinding contract). */
  --dsh-scrollbar-thumb: var(--dsw-alias-scrollbar-bg-l2);
  --dsh-scrollbar-thumb-hover: var(--dsw-alias-scrollbar-hover-l2);
}

/* Primary cards grow with their content between compact and readable bounds. */
.duk-menu-list {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  z-index: 100;
  min-width: min(144px, var(--dsh-anchored-max-width, 100vw));
  max-width: min(360px, var(--dsh-anchored-max-width, 100vw));
}

/* Legacy slots can render no rows; keep empty context popups out of layout. */
.duk-menu-list[data-context-menu]:not(:has([role='menuitem'])) {
  display: none;
}

/* Portal mode: fixed in the viewport, coordinates supplied inline from the

 * don't apply). Portaled lists must layer above modal overlays (z 1000) \u2014
 * an anchor inside a dialog still expects its menu on top. */
.duk-menu-portal {
  position: fixed;
  top: auto;
  left: auto;
  z-index: 1100;
}

/* Open above the anchor (empty-state workspace chip: figma 122:9481). */
.duk-menu-sideTop {
  top: auto;
  bottom: calc(100% + 4px);
}

.duk-menu-alignEnd {
  left: auto;
  right: 0;
}

/* Viewport fit: the card stops 12px short of the viewport's top/bottom edges
 * (the portal MARGIN in Menu.tsx; the top side widens to the frame's published
 * overlay inset) and taller content scrolls inside .viewport, so a pinned

 * shrinks the visible height while \`vh\` keeps the taller bars-hidden height, so
 * a \`vh\` cap exceeds the viewport the placement clamps into and the card ends

  max-height: min(calc(100dvh - 12px - max(12px, var(--dsh-frame-overlay-top, 12px))), var(--dsh-anchored-max-height, 100vh));
}

.duk-menu-viewport {
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.duk-menu-scrollable .duk-menu-viewport {
  overflow-y: auto;
}

/* Pinned rows below the scroll region; l2 hairline (l1 is near-invisible on
 * the menu surface) mirrors the .separator spacing. */
.duk-menu-footer {
  flex: none;
  display: flex;
  flex-direction: column;
  margin-top: 3px;
  padding-top: 3px;
  border-top: 0.5px solid var(--dsw-alias-border-l2);
}

.duk-menu-list[data-context-menu] .duk-menu-footer:has(> .duk-menu-separator:first-child) {
  margin-top: 0;
  padding-top: 0;
  border-top: none;
}

.duk-menu-itemWrap {
  position: relative;
}

/* Menu cell: compact text, icon, and selection spacing. */
.duk-menu-item {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  min-height: 34px;
  padding: 6px 8px;
  border: none;
  border-radius: var(--dsw-radius-md);
  background: transparent;
  cursor: pointer;
  font-size: 13px;
  line-height: 20px;
  color: var(--dsw-alias-label-primary);
  text-align: left;
}

@media (hover: hover) {
  .duk-menu-item:hover:not(:disabled):not([aria-disabled='true']) {
    background: var(--dsw-alias-interactive-bg-hover);
  }
}

/* Arrow navigation moves real focus, so the row the keyboard is on carries the
   same fill the pointer gets: the fill is the row's focus indication, and the
   browser's default ring would double it. */
.duk-menu-item:focus-visible:not(:disabled) {
  background: var(--dsw-alias-interactive-bg-hover);
  outline: none;
}

.duk-menu-denseList .duk-menu-item {
  min-height: 30px;
  padding-block: 4px;
}

.duk-menu-denseList .duk-menu-label {
  padding-block: 3px;
}

.duk-menu-list.duk-menu-compactList,
.duk-menu-submenu.duk-menu-compactList {
  min-width: min(156px, var(--dsh-anchored-max-width, 100vw));
  padding: 4px;
}

.duk-menu-compactList .duk-menu-item {
  min-height: 24px;
  gap: 5px;
  padding: 2px 6px;
  border-radius: var(--dsw-radius-sm);
  font-size: 11px;
  line-height: 17px;
}

.duk-menu-compactList .duk-menu-itemIcon {
  width: 12px;
  height: 12px;
}

.duk-menu-compactList .duk-menu-separator {
  margin: 2px 6px;
}

.duk-menu-compactList .duk-menu-label {
  padding: 3px 6px;
  font-size: 10px;
  line-height: 15px;
}

.duk-menu-item:disabled,
.duk-menu-item[aria-disabled='true'] {
  opacity: 0.4;
  cursor: not-allowed;
}

.duk-menu-itemIcon {
  display: inline-flex;
  flex: none;
  width: 14px;
  height: 14px;
  align-items: center;
  justify-content: center;
  color: var(--dsw-alias-menu-icon);
}

.duk-menu-itemIcon svg,
.duk-menu-check {
  width: 14px;
  height: 14px;
}

.duk-menu-compactList .duk-menu-itemIcon svg,
.duk-menu-compactList .duk-menu-check {
  width: 12px;
  height: 12px;
}

.duk-menu-itemLabel {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.duk-menu-shortcut {
  flex: none;
  margin-inline-start: auto;
}

.duk-menu-shortcut .duk-menu-shortcutKeys {
  color: var(--dsw-alias-label-caption);
  font-size: 11px;
  line-height: 16px;
}

@media (pointer: coarse) {
  :global(html:not([data-input-modality='keyboard'])) .duk-menu-shortcut {
    display: none;
  }
}

.duk-menu-check {
  flex: none;
  color: var(--dsw-alias-label-primary);
}

/* Selected cell keeps the plain fill (marker is the trailing check); the
 * class remains as a hook for owner-side emphasis. */
.duk-menu-selected {
  background: transparent;
}

/* Fill-mode selection: the row holds the hover fill instead of a check. */
.duk-menu-selectedFill {
  background: var(--dsw-alias-interactive-bg-hover);
}

/* Destructive row: error text/icon, danger hover fill. */
.duk-menu-danger {
  color: var(--dsw-alias-state-error-primary);
}

.duk-menu-danger .duk-menu-itemIcon {
  color: var(--dsw-alias-state-error-primary);
}

@media (hover: hover) {
  .duk-menu-danger:hover:not(:disabled):not([aria-disabled='true']) {
    background: var(--dsw-alias-interactive-bg-hover-danger);
  }
}

.duk-menu-danger:focus-visible:not(:disabled) {

  outline: none;
}

/* Heading row: non-interactive small grey text, padding aligned with items. */
.duk-menu-label {
  padding: 6px 8px;
  font-size: 11px;
  line-height: 15px;
  color: var(--dsw-alias-label-tertiary);

  .duk-json-tree-row:not(.duk-json-tree-topLevelBracket):hover:not(:has(.duk-json-tree-row:hover))::after {
    position: absolute;
    z-index: 0;
    top: 0;
    right: 0;
    left: 0;
    height: var(--json-tree-row-height, 16px);
    background: var(--json-tree-hover);
    content: '';
    pointer-events: none;
  }
}

.duk-json-tree-row > span:not(.duk-json-tree-expander, .duk-json-tree-copySlot) {
  position: relative;
  z-index: 1;
}

.duk-json-tree-label {
  margin-right: 3px;
  color: var(--json-tree-property);
  font-weight: 400;
}

.duk-json-tree-clickableLabel {
  cursor: pointer;
}

.duk-json-tree-stringValue {
  color: var(--json-tree-string);
}

.duk-json-tree-stringField {
  position: relative;
  z-index: 1;
  display: flow-root;
}

.duk-json-tree-stringText {
  display: block;
  max-height: calc(var(--json-tree-collapsed-lines) * 16px);
  padding-left: 12px;
  overflow: hidden;
  text-indent: -12px;
  word-break: break-all;
}

.duk-json-tree-stringRaw {
  margin: 4px 0 0 12px;
  overflow: auto;
  color: var(--dsw-alias-label-primary);
  font: inherit;
  overflow-wrap: normal;
  white-space: pre;
  word-break: normal;
}

.duk-json-tree-stringActions {
  position: absolute;
  top: 1px;
  right: 4px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 4px;
  width: fit-content;
  height: 16px;
}

.duk-json-tree-stringRaw[data-wrap='true'] {
  overflow-wrap: anywhere;
  white-space: pre-wrap;
  word-break: break-all;
}

.duk-json-tree-stringActions > .duk-json-tree-copySlot {
  opacity: 1;
  pointer-events: auto;
}

.duk-json-tree-stringToggleSlot {
  display: flex;
  float: right;
  align-items: flex-end;
  height: calc(var(--json-tree-collapsed-lines) * 16px);
  margin-left: 2px;
  shape-outside: inset(calc((var(--json-tree-collapsed-lines) - 1) * 16px) 0 0);
  pointer-events: none;
}

.duk-json-tree-stringToggle {
  display: inline-flex;
  align-items: baseline;
  gap: 2px;
  margin: 0;
  padding: 0;
  border: 0;
  color: var(--dsw-alias-label-secondary);
  background: transparent;
  font: inherit;
  text-indent: 0;
  white-space: nowrap;
  cursor: pointer;
  pointer-events: auto;
}

@media (hover: hover) {
  .duk-json-tree-stringToggle:hover {
    color: var(--dsw-alias-label-primary);
  }
}

.duk-json-tree-stringToggle:focus-visible {
  outline: 1px solid var(--dsw-focus-ring-color, var(--dsw-alias-state-business-primary));
  outline-offset: 1px;
}

.duk-json-tree-row:has(> .duk-json-tree-stringField) {
  --json-tree-row-height: 100%;
}

.duk-json-tree-summary {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.duk-json-tree-numberValue {
  color: var(--json-tree-number);
}

.duk-json-tree-keywordValue {
  color: var(--json-tree-keyword);
}

.duk-json-tree-otherValue {
  color: var(--dsw-alias-label-secondary);
}

.duk-json-tree-punctuation {
  color: var(--json-tree-punctuation);
}

.duk-json-tree-preview {
  color: var(--json-tree-punctuation);
}

.duk-json-tree-previewProperty {
  color: var(--json-tree-punctuation);
}

.duk-json-tree-previewEllipsis {
  color: var(--dsw-alias-label-tertiary);
}

.duk-json-tree-copySlot {
  display: inline-flex;
  width: 20px;
  height: 16px;
  opacity: 0;
  pointer-events: none;
}

.duk-json-tree-row > .duk-json-tree-copySlot {
  position: absolute;
  z-index: 2;
  top: 0;
  right: 0;
}

.duk-json-tree-row:has(> .duk-json-tree-stringField) > .duk-json-tree-copySlot {
  top: auto;
  bottom: 0;
}

.duk-json-tree-row:has(> .duk-json-tree-copySlot) > .duk-json-tree-stringField .duk-json-tree-stringToggleSlot {
  padding-right: 24px;
}

.duk-json-tree-row[data-json-copy-active] > .duk-json-tree-copySlot,
.duk-json-tree-copySlot:focus-within {
  opacity: 1;
  pointer-events: auto;
}

@media (hover: hover) {
  .duk-json-tree-row:hover:not(:has(.duk-json-tree-row:hover)) > .duk-json-tree-copySlot {
    opacity: 1;
    pointer-events: auto;
  }
}

.duk-json-tree-actionButton {
  box-sizing: border-box;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 16px;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: var(--dsw-radius-xs);
  color: var(--dsw-alias-label-secondary);
  background: transparent;
  cursor: pointer;
}

@media (hover: hover) {
  .duk-json-tree-actionButton:hover {
    color: var(--dsw-alias-label-primary);
  }
}

.duk-json-tree-actionButton[aria-pressed='true'] {
  color: var(--dsw-alias-state-business-primary);
}

.duk-json-tree-actionButton:focus-visible {
  outline: 1px solid var(--dsw-focus-ring-color, var(--dsw-alias-state-business-primary));
  outline-offset: -1px;
}

.duk-json-tree-actionButton[data-state='failed'] {
  color: var(--dsw-alias-state-error-primary);
}

.duk-json-tree-expander {
  position: absolute;
  z-index: 2;
  top: 0;
  left: 0;
  display: inline-flex;
  align-items: center;
  justify-content: flex-start;
  box-sizing: border-box;
  width: 8px;
  height: 16px;
  margin: 0;
  color: var(--json-tree-icon);
  cursor: pointer;
  user-select: none;
}

.duk-json-tree-expander::before {
  width: 0;
  height: 0;
  border-top: 4px solid transparent;
  border-bottom: 4px solid transparent;
  border-left: 6px solid currentColor;
  content: '';
  transform: scale(0.75);
  transform-origin: 33.333% center;
}

.duk-json-tree-collapseIcon::before {
  transform: rotate(90deg) scale(0.75);
}

@media (hover: hover) {
  .duk-json-tree-expander:hover {
    color: var(--dsw-alias-label-primary);
  }
}

.duk-json-tree-expander:focus-visible {
  outline: none;
}

.duk-json-tree-collapsedContent {
  margin: 0 1px;
  color: var(--json-tree-punctuation);
  cursor: pointer;
}

.duk-json-tree-collapsedContent::after {
  content: '\u2026';
}

@media (hover: none) {
  .duk-json-tree-copySlot { opacity: 1; pointer-events: auto; }

  .duk-json-tree-row:has(> .duk-json-tree-copySlot) { padding-right: 24px; }
}

  border: none;

    color: var(--dsw-alias-label-secondary);
