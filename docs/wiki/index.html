/* ===== base.css ===== */
/* Base variables referenced by the token sheets and component CSS but defined
 * upstream (deepsuite theme/global.css) — supplied here so the composite
 * --dsw-font-* variables resolve and motion rides the upstream curve. Code
 * font stack deliberately omits a bare `monospace` tail (Windows CJK falls
 * back to SimSun otherwise). */
:root {
  --dsh-font-family-text-default: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
    'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --dsw-font-family: var(--dsh-font-family-text-default);
  --dsw-font-family-brand: 'Montserrat', var(--dsh-font-family-text-default);
  --dsh-font-family-code-default: 'SF Mono', 'JetBrains Mono', 'Fira Code', Consolas,
    'Liberation Mono', Menlo, Courier, 'PingFang SC', 'Microsoft YaHei';
  --ds-font-family-code: var(--dsh-font-family-code-default);
  --ds-ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
  --ds-transition-duration: 0.2s;
  --ds-transition-duration-fast: 0.1s;
  --ds-transition-duration-slow: 0.3s;
  --dsw-radius-xs: 4px;
  --dsw-radius-sm: 8px;
  --dsw-radius-md: 12px;
  --dsw-radius-lg: 16px;
  --dsw-radius-xl: 20px;
  --dsw-radius-panel: 28px;
}

/* User font lists (--dsh-font-family-text/-code, written on body by the theme
 * boot script and ThemePresenter) lead the built-in stacks. An unset list
 * falls back to the built-in stack itself; the repeated families are inert. */
body {
  --dsw-font-family: var(--dsh-font-family-text, var(--dsh-font-family-text-default)), var(--dsh-font-family-text-default);
  --ds-font-family-code: var(--dsh-font-family-code, var(--dsh-font-family-code-default)), var(--dsh-font-family-code-default);
  --dsw-alias-settings-card-fill: var(--dsw-alias-bg-layer-2);
  --dsw-alias-settings-card-stroke: var(--dsw-alias-border-l4);
}

/* ===== corner-shape.css ===== */
/* Smooth corner curvature for every rounded surface. Inside the support
 * guard, all corners curve along superellipse(1.5) — between a circular arc
 * (round = superellipse(1)) and a squircle (superellipse(2)) — instead of the
 * default arc; engines without corner-shape keep circular corners because the
 * token and the rule exist only inside the guard.
 *
 * corner-shape does not inherit, so the universal selector applies the token
 * to elements and their ::before/::after; other pseudo-elements (for example
 * the ::-webkit-scrollbar parts) stay circular.
 *
 * Full-round shapes opt out where they are declared: a superellipse deforms a
 * circle into a squircle and squares off capsule ends, so every effectively
 * uncapped radius (50%, 100%, or a pill radius far above the box size) pairs
 * `corner-shape: round` with its `border-radius` in the owning component
 * sheet. The corner-shape stylesheet spec enforces that pairing. */
@supports (corner-shape: superellipse(1.5)) {
  :root {
    --dsw-corner-shape: superellipse(1.5);
  }

  *,
  *::before,
  *::after {
    corner-shape: var(--dsw-corner-shape);
  }
}

/* Overlays without MenuSurface's opaque backing cannot blur page content over
 * native vibrancy reliably, so their fill stays nearly opaque on macOS. */

  --dsw-specific-menu: rgba(248, 249, 250, 0.94);
}

html[data-platform='darwin'] body[data-ds-dark-theme] {
  --dsw-specific-menu: rgba(48, 49, 54, 0.94);
}

/* ===== focus.css ===== */
/* Components own offsets; dense tables and toolbars may keep a 1px ring. */
:root {
  --dsw-focus-ring-width: 2px;
}

/* The fallback names the colour and the standard width, never the style: a control that
 * disables its outline keeps `none` and paints nothing. Without the width, Chromium's
 * unnamed ring stayed at `auto 1px` while every declared ring used the standard geometry.
 * Declared rings also read this color, including rings on descendants and pseudo-elements. */
:focus-visible {
  outline-color: var(--dsw-focus-ring-color, var(--dsw-alias-state-business-primary));
  outline-width: var(--dsw-focus-ring-width);
}

/* ui-primitives/input-modality publishes the attribute. Editable controls keep
 * their focus feedback on click; other controls reveal rings on keyboard
 * navigation. Only ring paint is suppressed, not elevation or selected borders. */
html[data-input-modality='pointer'] body :focus-visible:not(:read-write) {
  --dsw-focus-ring-color: transparent;
  outline-color: transparent;
}

/* ===== gradient-shadow-text.css ===== */
body {
  --dsw-linear-gradient-think: linear-gradient(180deg, #fff 20.19%, rgba(255, 255, 255, 0) 100%);
  --dsw-linear-think-select: linear-gradient(180deg, #f5f6f7 20.19%, rgba(245, 246, 247, 0) 100%);
  /* 阴影 */
  --dsw-shadow-lv1: 0 2px 4px 0 rgba(0, 0, 0, 0.05);
  --dsw-shadow-lv1-blur: 0 4px 12px 0 rgba(0, 0, 0, 0.02);
  --dsw-shadow-lv2: 0 4px 12px 0 rgba(0, 0, 0, 0.02), 0 2px 8px 0 rgba(0, 0, 0, 0.04);
  --dsw-shadow-lv3:
    0 0 1px 0 rgba(0, 0, 0, 0.2), 0 0 4px 0 rgba(0, 0, 0, 0.02), 0 12px 32px 0 rgba(0, 0, 0, 0.08);
  /* Elevation：浮层/面板/面型按钮的描边+投影三件套。0.5px 发丝描边画在
     box-shadow 里（组件配 border: 0，不占布局），叠两层极淡柔光；深色主题下
     柔光几乎不可见，由描边承担分离。描边颜色经 --dsw-elevation-stroke-color
     间接，组件可重绑（菜单面重绑最浅的 l1、输入框重绑 l2，输入框的
     workspace-trigger 态置 transparent 只保留柔光）。soft 供输入框：更大
     模糊、更低透明度的柔光。默认色只声明在 body 上，让表面的重绑沿继承
     传给真正消费投影的后代。 */
  --dsw-elevation-stroke-color: var(--dsw-alias-border-l4);
  /* Blocking masks dim the page; menu backgrounds retain their blur. */
  --dsw-mask-blur: none;
  --dsw-menu-backdrop-filter: blur(40px) saturate(150%);
}

body[data-ds-dark-theme] [data-menu-material] {
  --dsw-elevation-stroke-color: var(--dsw-alias-border-l3);
}

/* 派生 elevation 值逐元素声明而非从 body 继承：继承传下来的是在 body 上就
   已替换完 var() 的值，组件重绑 --dsw-elevation-stroke-color 将无法进入
   var(--dsw-elevation-*)；逐元素声明让每个元素按自己看到的描边色重新替换
   （同 scrollbar.css 对 --dsh-scrollbar-thumb 的处理）。 */
body,
body * {
  --dsw-elevation-stroke: 0 0 0 0.5px var(--dsw-elevation-stroke-color);
  --dsw-elevation-panel:
    var(--dsw-elevation-stroke), 0 3px 8px 0 rgba(0, 0, 0, 0.03), 0 0 16px 0 rgba(0, 0, 0, 0.02);
  --dsw-elevation-prominent:
    var(--dsw-elevation-stroke), 0 3px 8px 0 rgba(0, 0, 0, 0.04), 0 0 20px 0 rgba(0, 0, 0, 0.05);
  --dsw-elevation-soft:
    var(--dsw-elevation-stroke), 0 4px 16px 0 rgba(0, 0, 0, 0.03), 0 0 24px 0 rgba(0, 0, 0, 0.03);
}

body[data-ds-dark-theme] {
  --dsw-linear-gradient-think: linear-gradient(180deg, #151517 20.19%, rgba(21, 21, 23, 0) 100%);
  --dsw-linear-think-select: linear-gradient(180deg, #232325 20.19%, rgba(35, 35, 37, 0) 100%);
}

/* ---------- 字体 ---------- */
/* 由 @deepseek-figma-plugin/custom-variable-name 插件导出 */
/* Markdown 阶梯整体按 0.875（正文 16 → 14）等比缩放，四舍五入到整数像素；
   重新从 Figma 导出时需要保留这一缩放。 */
/* Bootstrap and ThemePresenter set the integer content size on body (10–22px,
   default 14px). Headings and body variants share its pixel delta. Secondary
   text uses size − 1 through 14px, then size − 2: 10→9, 14→13, 15→13, 22→20.
   max(13px, ...) selects the delta, not a font-size floor. Small typography keeps a
   fixed size; code typography follows the separate code size setting. */
body {
  --dsh-content-font-delta: calc(var(--dsh-content-font-size, 14px) - 14px);
  --dsh-content-font-size-secondary: min(calc(var(--dsh-content-font-size, 14px) - 1px), max(13px, calc(var(--dsh-content-font-size, 14px) - 2px)));
  --dsh-content-font-delta-secondary: calc(var(--dsh-content-font-size-secondary) - 13px);
  /* Code size setting (--dsh-code-font-size, integer px 10–16, default 11)
     is the code-block size; inline code and the small tool variant move by
     the same increment. */
  --dsh-code-font-delta: calc(var(--dsh-code-font-size, 11px) - 11px);

  --dsw-font-markdown-h1: 700 calc(21px + var(--dsh-content-font-delta)) / calc(30px + var(--dsh-content-font-delta)) var(--dsw-font-family);
  --dsw-font-markdown-h1-font-family: var(--dsw-font-family);
  --dsw-font-markdown-h1-font-weight: 700;
  --dsw-font-markdown-h1-line-height: calc(30px + var(--dsh-content-font-delta));
  --dsw-font-markdown-h1-font-size: calc(21px + var(--dsh-content-font-delta));
  --dsw-font-markdown-h1-font-style: normal;

  --dsw-font-markdown-h2: 700 calc(19px + var(--dsh-content-font-delta)) / calc(28px + var(--dsh-content-font-delta)) var(--dsw-font-family);
  --dsw-font-markdown-h2-font-family: var(--dsw-font-family);
  --dsw-font-markdown-h2-font-weight: 700;
  --dsw-font-markdown-h2-line-height: calc(28px + var(--dsh-content-font-delta));
  --dsw-font-markdown-h2-font-size: calc(19px + var(--dsh-content-font-delta));
  --dsw-font-markdown-h2-font-style: normal;

  --dsw-font-markdown-h3: 700 calc(18px + var(--dsh-content-font-delta)) / calc(26px + var(--dsh-content-font-delta)) var(--dsw-font-family);
  --dsw-font-markdown-h3-font-family: var(--dsw-font-family);
  --dsw-font-markdown-h3-font-weight: 700;
  --dsw-font-markdown-h3-line-height: calc(26px + var(--dsh-content-font-delta));

  --dsw-font-markdown-h4: 600 var(--dsh-content-font-size, 14px) / calc(24px + var(--dsh-content-font-delta)) var(--dsw-font-family);
  --dsw-font-markdown-h4-font-family: var(--dsw-font-family);

/* ===== scrollbar.css ===== */
/* Scrollbar skin: the sole consumer of the four --dsw-alias-scrollbar-*
 * tokens. Without it every scrolling region renders the UA scrollbar, which
 * ignores the theme — a light native bar over the dark palette.
 *
 * The rules sit on `body`, not `html`: design-platform.css declares the
 * --dsw-alias-* tokens on `body` (and the dark overrides on
 * `body[data-ds-dark-theme]`), and custom properties only inherit downward,
 * so an `html` rule resolves them to the guaranteed-invalid value and
 * `scrollbar-color` falls back to `auto`.
 *
 * Surfaces pick their elevation by rebinding --dsh-scrollbar-thumb{,-hover}:
 * the l1 pair here is the base-surface default, and an elevated surface
 * (menu, popover, dialog) rebinds to the l2 pair on its own container. A
 * scroll container may also rebind the three geometry variables below. */

body {
  --dsh-scrollbar-thumb: var(--dsw-alias-scrollbar-bg-l1);
  --dsh-scrollbar-thumb-hover: var(--dsw-alias-scrollbar-hover-l1);
  --dsh-scrollbar-thumb-border: 0px;
  --dsh-scrollbar-track-margin: 0px;
  /* The WebKit bar's layout width, mirrored by the ::-webkit-scrollbar rule
     below. A surface that must align itself beside a space-consuming bar
     (ConversationRoot's overlay composer seat) reads this instead of
     hardcoding the number. */
  --dsh-scrollbar-width: 5px;
}

/* The two paths are mutually exclusive, and the gate is load-bearing rather
   than defensive. A non-`auto` `scrollbar-width` or `scrollbar-color` makes
   Chromium and Safari drop every `::-webkit-scrollbar*` rule for that
   element, including `::-webkit-scrollbar-thumb:hover` — measured in chromium
   as a `::-webkit-scrollbar` width taking effect on its own and being
   ignored as soon as `scrollbar-width: thin` is added. Declaring both
   unconditionally therefore leaves the hover tokens with no rendering at all,
   because the engines that implement the hover pseudo-element are exactly the
   ones the standard properties silence, and Firefox has no hover
   pseudo-element to fall back on.

   `not selector(::-webkit-scrollbar)` is true only where the pseudo-element
   is unimplemented, so Firefox takes the standard path and WebKit-based
   engines take the pseudo-element path. An engine too old for the
   `selector()` function makes the condition invalid, which evaluates false
   and selects the pseudo-element path — the correct side for the pre-16.4
   Safari that is the realistic case. */
@supports not selector(::-webkit-scrollbar) {
  /* Declared on every element rather than inherited from `body`. Inheriting
     would pass down the COLOUR already substituted at `body`, so a descendant
     rebinding --dsh-scrollbar-thumb could not change it; re-declaring makes
     each element substitute the variable as it sees it, which is what gives
     an elevated surface a working rebind. `scrollbar-width` is not an
     inherited property at all, so it needs the per-element declaration
     regardless.

     No hover counterpart exists on this path: `scrollbar-color` states one
     thumb colour and the engine derives its own hover treatment. */
  body,
  body * {
    scrollbar-width: thin;
    scrollbar-color: var(--dsh-scrollbar-thumb) transparent;
  }
}

/* Not gated in turn: an engine that does not implement these pseudo-elements
   drops the rules as unknown selectors, so the gate would only restate what
   selector matching already does. Not inherited either, hence the unscoped
   selectors. */
::-webkit-scrollbar {
  width: var(--dsh-scrollbar-width);
  height: var(--dsh-scrollbar-width);
}

/* Track stays transparent so the thumb reads against whatever surface scrolls
   under it; only the thumb carries a token colour. */
::-webkit-scrollbar-track {
  margin-block: var(--dsh-scrollbar-track-margin);
  background: transparent;
}

::-webkit-scrollbar-thumb {
  border: var(--dsh-scrollbar-thumb-border) solid transparent;
  border-radius: 999px;
  corner-shape: round;
  background: var(--dsh-scrollbar-thumb);
  background-clip: content-box;
}

@media (hover: hover) {
  ::-webkit-scrollbar-thumb:hover {
    background-color: var(--dsh-scrollbar-thumb-hover);
  }
}

/* Both scrollbars meeting in a corner: no separate token, so the corner
   matches the transparent track rather than the UA's opaque default. */
::-webkit-scrollbar-corner {
  background: transparent;
}

/* ===== segmented-control/segmented-control.css ===== */
/* The track is the same translucent fill the hover state uses, so it reads as
 * a place rather than a second button; the one raised part is the indicator,
 * a white pill that slides under the selected segment. Its stroke rides inside
 * the soft elevation shadow (border: 0), the way every elevated surface draws
 * its edge, so the elevation gate keeps it off the alias-border set.
 *
 * Segments are equal-width grid tracks sized to the widest label, which is
 * what lets one indicator be placed arithmetically: the tablist carries the
 * segment count and the selected index as custom properties, and the indicator
 * derives its width and offset from them instead of measuring the DOM. */
.duk-segmented-control-control {
  position: relative;
  display: inline-grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 2px;
  padding: 4px;
  border-radius: var(--dsw-radius-md);
  background: var(--dsw-alias-interactive-bg-hover);
}

.duk-segmented-control-indicator {
  position: absolute;
  top: 4px;
  left: 4px;
  width: calc((100% - 8px - 2px * (var(--dsh-segment-count) - 1)) / var(--dsh-segment-count));
  height: calc(100% - 8px);
  border: 0;
  border-radius: var(--dsw-radius-sm);
  background: var(--dsw-alias-bg-layer-1);
  box-shadow: var(--dsw-elevation-soft);
  transform: translateX(calc(var(--dsh-segment-index) * (100% + 2px)));
  transition: transform 160ms ease;
  pointer-events: none;
}

.duk-segmented-control-tab {
  box-sizing: border-box;
  position: relative;
  z-index: 1;
  height: 28px;
  padding: 0 16px;
  border: 0;
  border-radius: var(--dsw-radius-sm);

  color: var(--dsw-alias-label-secondary);

/* Full-viewport layer (figma Mask + Dialog 451:18655): mask + centered card.

   Cards size against this padding box: consumers cap growth with
   `max-height: 100%`, never their own viewport calc. */
.duk-modal-root {
  pointer-events: auto;
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: max(24px, var(--dsh-frame-overlay-top, 24px)) 24px;

/* Only paint excludes the native caption; the root still blocks background clicks. */

  backdrop-filter: var(--dsw-mask-blur);

  content: '';

/* Header row (figma Title row): pad l24/t22/r14/b12, SPACE_BETWEEN —

/* ===== tooltip/tooltip.css ===== */
.duk-tooltip-bubble {
  display: inline-flex;
  align-items: safe center;
  gap: 8px;
  position: fixed;
  z-index: 100;
  /* Fixed-position shrink-to-fit measures only the space from `left` to the
     viewport edge, so anchors near the right edge would wrap early;
     max-content sizes by the label alone, capped at half the viewport. */
  width: max-content;
  box-sizing: border-box;
  max-width: min(50vw, calc(100vw - 24px));
  max-height: calc(100vh - 24px);
  overflow: auto;
  padding: 3px 7px;
  border-radius: var(--dsw-radius-sm);
  background: var(--dsw-alias-tooltip-bg);
  color: var(--dsw-static-neutral-bluish-00);
  font-size: 13px;
  line-height: 20px;
  white-space: pre-line;
  /* Unbreakable tokens (URLs, paths) must not push past max-width. */
  overflow-wrap: break-word;
  pointer-events: none;
  animation: duk-tooltip-tooltip-in 150ms var(--ds-ease-in-out);
}

.duk-tooltip-bubble[data-portal] { z-index: 1100; }
.duk-tooltip-bubble[data-pinned] { pointer-events: auto; }

/* A 16px keycap centered beside a 20px label has 5px of vertical clearance. */

.duk-tooltip-bubble[data-side='right'],
.duk-tooltip-bubble[data-side='left'] {
  transform: translateY(-50%);
}

.duk-tooltip-bubble[data-side='bottom'] {
  transform: translateX(-50%);
}

.duk-tooltip-bubble[data-side='top'] {
  transform: translate(-50%, -100%);
}

/* End alignment: `left` carries the anchor's right edge, so the bubble sits
   fully left of it instead of centering. */
.duk-tooltip-bubble[data-side='bottom'][data-align='end'] {
  transform: translateX(-100%);
}

.duk-tooltip-bubble[data-side='top'][data-align='end'] {
  transform: translate(-100%, -100%);
}

@keyframes duk-tooltip-tooltip-in {
  from { opacity: 0; }
}

@media (prefers-reduced-motion: reduce) {

    animation: none;
  }
}

/* ===== menu/menu.css ===== */
.duk-menu-root {
  position: relative;
  display: inline-flex;
}

/* Compact translucent dropdown card shared by feature menus. */
.duk-menu-list,
.duk-menu-submenu {
  /* min-widths below are the design's outer card widths — include the pad. */
  box-sizing: border-box;
  padding: 4px;
  display: flex;
  flex-direction: column;
  gap: 0;
  border: 0;
  --dsw-elevation-stroke-color: var(--dsw-alias-border-l1);
  box-shadow: var(--dsw-elevation-prominent);
  /* Elevated surface: the scrollbar thumb takes the l2 elevation tokens. The
     declaration sits on the card rather than on `.scrollable .viewport`
     because the elevation is a property of this surface, and the custom
     properties inherit down to whichever descendant actually scrolls (see
     ui-theme styles/scrollbar.css for the rebinding contract). */
  --dsh-scrollbar-thumb: var(--dsw-alias-scrollbar-bg-l2);
  --dsh-scrollbar-thumb-hover: var(--dsw-alias-scrollbar-hover-l2);
}

/* Primary cards grow with their content between compact and readable bounds. */
.duk-menu-list {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  z-index: 100;
  min-width: min(144px, var(--dsh-anchored-max-width, 100vw));
  max-width: min(360px, var(--dsh-anchored-max-width, 100vw));
}

/* Legacy slots can render no rows; keep empty context popups out of layout. */
.duk-menu-list[data-context-menu]:not(:has([role='menuitem'])) {
  display: none;
}

/* Portal mode: fixed in the viewport, coordinates supplied inline from the
 * anchor rect (side/align resolved in JS, the in-place offset rules above
 * don't apply). Portaled lists must layer above modal overlays (z 1000) —
 * an anchor inside a dialog still expects its menu on top. */
.duk-menu-portal {
  position: fixed;
  top: auto;
  left: auto;
  z-index: 1100;
}

/* Open above the anchor (empty-state workspace chip: figma 122:9481). */
.duk-menu-sideTop {
  top: auto;
  bottom: calc(100% + 4px);
}

.duk-menu-alignEnd {
  left: auto;
  right: 0;
}

/* Viewport fit: the card stops 12px short of the viewport's top/bottom edges
 * (the portal MARGIN in Menu.tsx; the top side widens to the frame's published
 * overlay inset) and taller content scrolls inside .viewport, so a pinned
 * .footer stays visible. The dynamic unit, not `vh`: mobile browser chrome
 * shrinks the visible height while `vh` keeps the taller bars-hidden height, so
 * a `vh` cap exceeds the viewport the placement clamps into and the card ends
 * up taller than the screen showing it. Menus with submenu rows skip this
 * class — the overflow clip would crop the side card, so they rely on staying
 * short. */
.duk-menu-scrollable {
  max-height: min(calc(100vh - 12px - max(12px, var(--dsh-frame-overlay-top, 12px))), var(--dsh-anchored-max-height, 100vh));
  max-height: min(calc(100dvh - 12px - max(12px, var(--dsh-frame-overlay-top, 12px))), var(--dsh-anchored-max-height, 100vh));
}

.duk-menu-viewport {
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.duk-menu-scrollable .duk-menu-viewport {
  overflow-y: auto;
}

/* Pinned rows below the scroll region; l2 hairline (l1 is near-invisible on
 * the menu surface) mirrors the .separator spacing. */
.duk-menu-footer {
  flex: none;
  display: flex;
  flex-direction: column;
  margin-top: 3px;
  padding-top: 3px;
  border-top: 0.5px solid var(--dsw-alias-border-l2);
}

.duk-menu-list[data-context-menu] .duk-menu-footer:has(> .duk-menu-separator:first-child) {
  margin-top: 0;
  padding-top: 0;
  border-top: none;
}

.duk-menu-itemWrap {
  position: relative;
}

/* Menu cell: compact text, icon, and selection spacing. */
.duk-menu-item {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  min-height: 34px;
  padding: 6px 8px;
  border: none;
  border-radius: var(--dsw-radius-md);
  background: transparent;
  cursor: pointer;
  font-size: 13px;
  line-height: 20px;
  color: var(--dsw-alias-label-primary);
  text-align: left;
}

@media (hover: hover) {
  .duk-menu-item:hover:not(:disabled):not([aria-disabled='true']) {
    background: var(--dsw-alias-interactive-bg-hover);
  }
}

/* Arrow navigation moves real focus, so the row the keyboard is on carries the
   same fill the pointer gets: the fill is the row's focus indication, and the
   browser's default ring would double it. */
.duk-menu-item:focus-visible:not(:disabled) {
  background: var(--dsw-alias-interactive-bg-hover);
  outline: none;
}

.duk-menu-denseList .duk-menu-item {

}

.duk-menu-denseList .duk-menu-label {

.duk-menu-compactList .duk-menu-itemIcon {

}

  line-height: 15px;
}

.duk-menu-item:disabled,
.duk-menu-item[aria-disabled='true'] {
  opacity: 0.4;
  cursor: not-allowed;
}

.duk-menu-itemIcon {
  display: inline-flex;
  flex: none;
  width: 14px;
  height: 14px;
  align-items: center;
  justify-content: center;
  color: var(--dsw-alias-menu-icon);
}

.duk-menu-compactList .duk-menu-itemIcon svg,

.duk-menu-itemLabel {

@media (pointer: coarse) {

  }

.duk-menu-check {
  flex: none;
  color: var(--dsw-alias-label-primary);
}

/* Selected cell keeps the plain fill (marker is the trailing check); the
 * class remains as a hook for owner-side emphasis. */
.duk-menu-selected {
  background: transparent;
}

/* Fill-mode selection: the row holds the hover fill instead of a check. */
.duk-menu-selectedFill {
  background: var(--dsw-alias-interactive-bg-hover);
}

/* Destructive row: error text/icon, danger hover fill. */
.duk-menu-danger {
  color: var(--dsw-alias-state-error-primary);
}

.duk-menu-danger .duk-menu-itemIcon {
  color: var(--dsw-alias-state-error-primary);
}

@media (hover: hover) {
  .duk-menu-danger:hover:not(:disabled):not([aria-disabled='true']) {
    background: var(--dsw-alias-interactive-bg-hover-danger);
  }
}

.duk-menu-danger:focus-visible:not(:disabled) {
  background: var(--dsw-alias-interactive-bg-hover-danger);
  outline: none;
}

/* Heading row: non-interactive small grey text, padding aligned with items. */
.duk-menu-label {
  padding: 6px 8px;
  font-size: 11px;
  line-height: 15px;
  color: var(--dsw-alias-label-tertiary);
}

/* Separator endpoints align with the row content. The l2 stroke stays visible
 * on the menu surface. */
.duk-menu-separator {
  height: 0.5px;
  margin: 3px 8px;
  background: var(--dsw-alias-border-l2);
}

/* A data separator directly followed by a row that starts a group draws one
 * line, not two; a group start on the list's first row draws none. */
.duk-menu-separator + .duk-menu-separator,
.duk-menu-separator + .duk-menu-itemWrap > .duk-menu-separator:first-child,
.duk-menu-itemWrap:first-child > .duk-menu-separator:first-child {

  display: block;

  position: absolute;
  top: auto;
  bottom: -4px;

  z-index: 101;

.duk-menu-submenu::before {

  position: absolute;
  top: 0;
  bottom: 0;
  left: -10px;

.duk-menu-list[data-menu-phase='dismiss'],

@keyframes duk-menu-dsh-context-menu-out { from { opacity: 1; } to { opacity: 0; } }

/* ===== switch/switch.css ===== */
/* The on/off appearance keys off aria-checked rather than a parallel class, so
 * the visual state cannot disagree with the state assistive technology reads.

 * The capsule track and circular thumb opt out of the global superellipse. */
.duk-switch {
  box-sizing: border-box;
  position: relative;
  flex: 0 0 auto;
  width: 36px;
  height: 20px;
  padding: 2px;
  border: 0;

  corner-shape: round;
  background: var(--dsw-alias-border-l3);

}

}

.duk-switch:disabled {

.duk-switch:focus-visible {

  outline-offset: 2px;
}

.duk-switch-thumb {

  height: 16px;
  border-radius: 50%;

  background: var(--dsw-alias-label-primary-foreground);

.duk-switch[aria-checked='false'] .duk-switch-thumb {

}

.duk-switch[aria-checked='true'] .duk-switch-thumb {

.duk-pill-active {

/* ===== state-dot/state-dot.css ===== */
/* Solid states keep the 10px layout slot but paint one 6px currentColor core. */
.duk-state-dot-dot {
  position: relative;
  display: inline-block;
  flex: none;
}

.duk-state-dot-dot::after {
  content: '';
  position: absolute;
  inset: 20%;
  border-radius: 50%;
  corner-shape: round;
  background: currentColor;
}

.duk-state-dot-dot[data-state='done'] {
  color: var(--dsw-alias-state-success-primary);
}

.duk-state-dot-dot[data-state='warning'] {
  color: var(--dsw-alias-state-warn-primary);
}

.duk-state-dot-dot[data-state='error'] {
  color: var(--dsw-alias-state-error-primary);
}

/* Idle is the absence of activity and uses the theme's neutral state step. */
.duk-state-dot-dot[data-state='idle'] {
  color: var(--dsw-alias-state-idle-primary);
}

/* Ongoing is the sole non-dot state: a quiet full ring sits behind a centered
 * breathing arc while the complete glyph rotates continuously. Both animations
 * share one 1.5s period so pinning their start times aligns them together. */
.duk-state-dot-spinner {
  flex: none;
  color: var(--dsw-alias-label-tertiary);
}

.duk-state-dot-spinnerMotion {
  transform-origin: center;
  animation: duk-state-dot-dsh-state-dot-spin 1.5s linear infinite;
}

.duk-state-dot-spinnerTrack,
.duk-state-dot-spinnerArc {
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
}

.duk-state-dot-spinnerTrack {
  opacity: 0.25;
}

.duk-state-dot-spinnerArc {
  stroke-dasharray: 12 150;
  animation: duk-state-dot-dsh-state-dot-dash 1.5s ease-in-out infinite;
}

@keyframes duk-state-dot-dsh-state-dot-spin {
  to { transform: rotate(360deg); }
}

@keyframes duk-state-dot-dsh-state-dot-dash {
  0% {
    stroke-dasharray: 12 150;
    stroke-dashoffset: 0;
  }

  50% {
    stroke-dasharray: 24 150;
    stroke-dashoffset: -6;
  }

  100% {
    stroke-dasharray: 12 150;
    stroke-dashoffset: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .duk-state-dot-spinnerMotion,
  .duk-state-dot-spinnerArc {
    animation: none;
  }

  .duk-state-dot-spinnerArc {
    stroke-dasharray: 18 150;
    stroke-dashoffset: -3;
  }
}

.duk-state-dot-step { display: inline-flex; flex: none; align-items: center; justify-content: center; box-sizing: border-box; border-radius: 50%; corner-shape: round; border: 1.5px solid var(--dsw-alias-label-tertiary); color: var(--dsw-alias-label-primary-foreground); }
.duk-state-dot-step[data-state='done'] { border-color: var(--dsw-alias-state-success-primary); background: var(--dsw-alias-state-success-primary); }
.duk-state-dot-step[data-state='error'] { border-color: var(--dsw-alias-state-error-primary); background: var(--dsw-alias-state-error-primary); }
.duk-state-dot-step[data-state='warning'] { border-color: var(--dsw-alias-state-warn-primary); }

/* ===== checkbox/checkbox.css ===== */

/* ===== disclosure-row/disclosure-row.css ===== */
/* Shared disclosure header: [16px leading] gap 6 [title 13/24] at the default
   size. The Settings font-size preference moves the row through the
   body-published axis: title size follows the secondary tier
   (--dsh-content-font-size-secondary: one step under the body — setting −1 at
   ≤14, setting −2 above), and the row height, leading box, and glyph edge
   shift by the body px delta so the icon keeps its optical share of the
   line. */

.duk-disclosure-row-root {
  display: flex;
  flex-direction: column;
  width: 100%;
  min-width: 0;
}

.duk-disclosure-row-header {
  display: flex;
  align-items: center;
  min-width: 0;
}

.duk-disclosure-row-header[data-has-accessory] {
  gap: 8px;
}

.duk-disclosure-row-header[data-has-accessory] .duk-disclosure-row-row {
  flex: 0 1 auto;
}

.duk-disclosure-row-row {
  flex: 1 1 auto;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  height: calc(24px + var(--dsh-content-font-delta, 0px));
  min-width: 0;
  color: var(--dsw-alias-label-tertiary);
  transition: color 100ms ease;
}

.duk-disclosure-row-row[data-expandable] {
  cursor: pointer;
}

@media (hover: hover) {
  .duk-disclosure-row-row:hover {
    color: var(--dsw-alias-label-secondary);
  }
}

.duk-disclosure-row-leading {
  position: relative;
  flex: none;
  width: calc(16px + var(--dsh-content-font-delta, 0px));
  height: calc(16px + var(--dsh-content-font-delta, 0px));
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-right: 6px;
  padding: 0;
  border: none;
  background: none;
  color: inherit;
}

/* Flow-row glyphs render at 14px inside the 16px box; the CSS edge overrides
   each svg's own width/height attributes so every registered icon scales
   without a per-callsite size prop. StateDot (its svg carries data-state)
   stays at its fixed figma size — it is a status mark, not text furniture. */
.duk-disclosure-row-leading svg:not([data-state]) {
  width: calc(14px + var(--dsh-content-font-delta, 0px));
  height: calc(14px + var(--dsh-content-font-delta, 0px));
}

button.duk-disclosure-row-leading {
  cursor: pointer;
}

.duk-disclosure-row-iconIdle {
  display: inline-flex;
  opacity: 1;
  transition: opacity 100ms ease;
}

.duk-disclosure-row-chevronHover {
  position: absolute;
  inset: 0;
  margin: auto;
  opacity: 0;
  transition: opacity 100ms ease;
}

@media (hover: hover) {
  .duk-disclosure-row-row:hover .duk-disclosure-row-iconIdle {
    opacity: 0;
  }

  .duk-disclosure-row-row:hover .duk-disclosure-row-chevronHover {
    opacity: 1;
  }
}

.duk-disclosure-row-title {
  flex: none;
  font-size: var(--dsh-content-font-size-secondary, 13px);
  line-height: calc(24px + var(--dsh-content-font-delta, 0px));
  color: inherit;
}

@media (prefers-reduced-motion: reduce) {
  .duk-disclosure-row-row {
    transition: none;
  }
}

/* ===== text-shimmer/text-shimmer.css ===== */
.duk-text-shimmer-root {
  position: relative;
  display: inline-grid;
  width: max-content;
  max-width: 100%;
  min-width: 0;
  vertical-align: top;
  color: inherit;
}

.duk-text-shimmer-content {
  display: flex;
  align-items: center;
  min-width: 0;
}

.duk-text-shimmer-text {
  color: inherit;
}

.duk-text-shimmer-text[data-shimmer-text]::after {
  content: attr(data-shimmer-text);
}

.duk-text-shimmer-decoration {
  position: absolute;
  inset: 0;
  /* The moving mask must not enlarge any ancestor's scrollable area. */
  overflow: clip;
  pointer-events: none;
  user-select: none;
}

.duk-text-shimmer-sweep {
  position: absolute;
  inset: 0;
  overflow: hidden;
  color: var(--dsw-alias-label-shimmer);
  mask-image: linear-gradient(105deg, transparent 0%, black 40% 60%, transparent 100%);
  transform: translateX(-100%);
  animation-name: duk-text-shimmer-dsh-row-shimmer-sweep;
}

/* Semantic base colors stay on the real content; the overlay supplies one tint. */
.duk-text-shimmer-sweep * {
  color: inherit !important;
}

.duk-text-shimmer-sweep [data-shimmer-decoration] {
  background: currentColor;
}

/* Opposite transforms keep every glyph aligned while their shared mask moves. */
.duk-text-shimmer-highlight {
  width: 100%;
  height: 100%;
  transform: translateX(100%);
  animation-name: duk-text-shimmer-dsh-row-shimmer-highlight;
}

.duk-text-shimmer-sweep,
.duk-text-shimmer-highlight {
  animation-duration: 1.5s;
  animation-delay: 0.3s;
  animation-timing-function: steps(48, end);
  animation-iteration-count: infinite;
}

@keyframes duk-text-shimmer-dsh-row-shimmer-sweep {
  0% { transform: translateX(-100%); }
  66.6667%, 100% { transform: translateX(100%); }
}

@keyframes duk-text-shimmer-dsh-row-shimmer-highlight {
  0% { transform: translateX(100%); }
  66.6667%, 100% { transform: translateX(-100%); }
}

@media (prefers-reduced-motion: reduce) {
  .duk-text-shimmer-decoration {
    display: none;
  }

  .duk-text-shimmer-sweep,
  .duk-text-shimmer-highlight {
    animation: none;
  }
}

  resize: none;
}

.duk-inline-editor-editor:focus {
  border-color: var(--dsw-alias-state-business-primary);
}

/* ===== toast/toast.css ===== */
/* The fade delay comes from the component as `--dsh-toast-hold`, so one value
   drives both the unmount timer and this animation; the fallback matches the
   component's own default. The fade DURATION still has to agree with FADE_MS
   in Toast.tsx, which no owner varies. */

.duk-toast {
  position: fixed;
  top: 40px;
  left: 50%;
  /* Above the 1000 the image lightbox backdrop uses: a failure reported while
     a preview is open must stay readable. */
  z-index: 1100;
  /* Announcements never intercept clicks. */
  pointer-events: none;
  display: flex;
  align-items: center;
  gap: 10px;
  /* Fixed boxes with `left` set shrink-to-fit against the space RIGHT of
     `left` (the -50% translate happens after sizing), so an anchored banner
     near the window edge would wrap early. max-content sizes the box from
     its text alone, capped by the max-width below. */
  width: max-content;
  max-width: min(640px, calc(100vw - 48px));
  padding: 12px 16px;
  border-radius: var(--dsw-radius-lg);
  /* The design platform's toast surface is dark in BOTH themes (bluish-800
     light / bluish-750 dark), so the label and the action text below stay
     fixed instead of flipping with the theme. */
  background: var(--dsw-alias-toast-bg);
  color: var(--dsw-alias-toast-label);
  font-size: 14px;
  line-height: 22px;
  box-shadow: var(--dsw-shadow-lv3);
  transform: translateX(-50%);
  animation:
    duk-toast-dsh-toast-in 160ms ease-out,
    duk-toast-dsh-toast-fade 1000ms ease var(--dsh-toast-hold, 3000ms) forwards;
}

.duk-toast-icon {
  display: grid;
  place-items: center;
  flex: none;
  color: var(--dsw-alias-state-warn-label);
}

.duk-toast-icon.duk-toast-success {
  color: var(--dsw-alias-state-success-primary);
}

.duk-toast-text {
  min-width: 0;
}

.duk-toast-action {
  display: inline;
  padding: 0;
  border: 0;
  background: none;
  /* deepseek-400, brightened at the designer's request, reads as the action
     against the always-dark toast surface without an underline. */
  color: var(--dsw-static-deepseek-400);
  font: inherit;
  cursor: pointer;
  /* Breathing room where the action text meets the surrounding copy. */
  margin-inline: 3px;
  /* The banner surface stays click-through (`pointer-events: none` above);
     only its action text takes the pointer. */
  pointer-events: auto;
}

@media (hover: hover) {
  .duk-toast-action:hover {
    opacity: 0.8;
  }
}

@keyframes duk-toast-dsh-toast-in {
  from {
    opacity: 0;
    transform: translate(-50%, -6px);
  }

  to {
    opacity: 1;
    transform: translate(-50%, 0);
  }
}

@keyframes duk-toast-dsh-toast-fade {
  to {
    opacity: 0;
    visibility: hidden;
  }
}

/* Reduced motion drops the slide-in; the delayed fade (an opacity change,
   not movement) still ends the banner before the timed unmount. */
@media (prefers-reduced-motion: reduce) {
  .duk-toast {
    animation: duk-toast-dsh-toast-fade 1000ms ease var(--dsh-toast-hold, 3000ms) forwards;
  }
}

/* ===== hover-card/hover-card.css ===== */
/* Block, not inline-flex: consumers wrap full-width list rows and an
 * inline wrapper would shrink them; the card still measures this rect. */
.duk-hover-card-root {
  position: relative;
  display: block;
}

/* The preview remains hit-testable so pointer entry cancels the grace close. */
.duk-hover-card-card {
  --dsw-hovercard-bg: #2C2C2E;
  position: fixed;
  z-index: 100;
  box-sizing: border-box;
  width: 244px;
  padding: 12px 16px;
  border-radius: var(--dsw-radius-lg);
  background: var(--dsw-hovercard-bg);
  box-shadow: var(--dsw-shadow-lv3);
}

.duk-hover-card-copyable {
  cursor: pointer;
}

.duk-hover-card-copyable:focus-visible {
  outline: var(--dsw-focus-ring-width) solid var(--dsw-focus-ring-color, var(--dsw-alias-state-business-primary));
  outline-offset: 2px;
}

.duk-hover-card-feedback {
  display: flex;
  align-items: center;
  justify-content: center;
}

.duk-hover-card-copied {
  color: #FFFFFF;
  font-size: 14px;
  line-height: 20px;
  text-align: center;
}

.duk-hover-card-status {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.duk-hover-card-preview {
  display: flex;
  flex-direction: column;
  padding: 0;
  overflow: hidden;
  border: 0;
  border-radius: var(--dsw-radius-lg);
  background: var(--dsw-alias-bg-layer-1);
  color: var(--dsw-alias-label-primary);
  box-shadow: var(--dsw-elevation-panel);
  opacity: 1;
  transition: opacity var(--dsh-hover-preview-fade) linear;
}

@starting-style {
  .duk-hover-card-preview { opacity: 0; }
}

.duk-hover-card-preview[data-closing] {
  opacity: 0;
  pointer-events: none;
}

@media (prefers-reduced-motion: reduce) {
  .duk-hover-card-preview { transition: none; }
}

.duk-hover-card-inline { display: inline; }
.duk-hover-card-media {
  --dsh-scrollbar-thumb: var(--dsw-alias-scrollbar-bg-l2);
  --dsh-scrollbar-thumb-hover: var(--dsw-alias-scrollbar-hover-l2);
  overflow: auto;
  padding: 8px;
  border: 0;
  color: var(--dsw-alias-label-primary);
  background: var(--dsw-specific-menu);
  backdrop-filter: var(--dsw-menu-backdrop-filter);
  box-shadow: var(--dsw-elevation-panel);
}

.duk-hover-card-fitContent {
  width: max-content;
}

.duk-hover-card-portal {
  display: contents;
}

.duk-hover-card-bridge {
  position: fixed;
  z-index: 100;
}

/* ===== image-lightbox/image-lightbox.css ===== */
/* Full-viewport layer that blocks background clicks, including on the Windows caption. */
.duk-image-lightbox-backdrop {
  position: fixed;
  inset: 0;
  z-index: 1000;
}

/* Painted area below the Windows caption; like Modal, the caption stays unpainted. */
.duk-image-lightbox-stage {
  position: absolute;
  inset: var(--dsh-frame-chrome-top, 0px) 0 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px;
}

/* Shared dimming mask below the preview and its controls. */
.duk-image-lightbox-mask {
  position: absolute;
  inset: 0;
  background: var(--dsw-alias-bg-mask-1);
  backdrop-filter: var(--dsw-mask-blur);
}

.duk-image-lightbox-image {
  position: relative;
  max-width: min(100%, 1600px);
  max-height: 100%;
  object-fit: contain;
  border-radius: var(--dsw-radius-lg);
  background: var(--dsw-specific-input-major);
  border: 0;
  box-shadow: var(--dsw-elevation-prominent);
}

.duk-image-lightbox-close {
  position: absolute;
  top: 20px;
  right: 20px;
  z-index: 1;
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border: 0.5px solid var(--dsw-alias-border-l2-darkmode-thin);
  border-radius: 999px;
  corner-shape: round;
  background: var(--dsw-specific-input-major);
  color: var(--dsw-alias-label-primary);
  cursor: pointer;
}

.duk-image-lightbox-close:focus-visible { outline: var(--dsw-focus-ring-width) solid var(--dsw-focus-ring-color, var(--dsw-alias-state-business-primary)); outline-offset: 3px; }

/* ===== image-preview/image-preview.css ===== */
.duk-image-preview-frame {
  position: relative;
  display: grid;
  place-items: center;
  width: 100%;
  height: 180px;
  overflow: hidden;
  border-radius: var(--dsw-radius-sm);
  background: var(--dsw-alias-bg-base);
}
.duk-image-preview-image { width: 100%; height: 100%; min-height: 0; object-fit: contain; opacity: 0; }
.duk-image-preview-image[data-ready] { opacity: 1; }
.duk-image-preview-status {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px;
  color: var(--dsw-alias-label-tertiary);
  font-size: 12px;
  line-height: 18px;
}

/* ===== animated-rows/animated-rows.css ===== */
.duk-animated-rows-exits {
  position: absolute;
  inset: 0;
  contain: strict;
  overflow: clip;
  pointer-events: none;
}

/* ===== user-message-bubble/user-message-bubble.css ===== */
.duk-user-message-bubble-bubble {
  max-width: 100%;
  background: var(--dsw-specific-bubble);
  border-radius: var(--dsw-radius-xl);
  padding: 10px 16px;
  font-size: var(--dsh-content-font-size, 14px);
  line-height: calc(22px + var(--dsh-content-font-delta, 0px));
  color: var(--dsw-alias-label-primary);
  white-space: pre-wrap;
  word-break: break-word;
}

/* ===== zoom-controls/zoom-controls.css ===== */
/* Zero specificity lets an owner className move the toolbar regardless of stylesheet order. */
:where(.duk-zoom-controls-panel) {
  bottom: 14px;
}

.duk-zoom-controls-panel {
  position: absolute;
  z-index: 2;
  inset-inline-start: 50%;
  display: flex;
  align-items: center;
  gap: 2px;
  box-sizing: border-box;
  padding: 4px 6px;
  /* TODO: replace this border and the literal shadow with `border: 0` and `--dsw-elevation-panel`
   * (docs/web-styling.md#component-rules), with visual review of the document preview. */
  border: 0.5px solid var(--dsw-alias-border-l3);
  border-radius: var(--dsw-radius-lg);
  color: var(--dsw-alias-label-primary);
  background: var(--dsw-alias-bg-layer-1);
  box-shadow: 0 8px 24px light-dark(#0000001a, #00000060), 0 2px 5px light-dark(#00000009, #00000035);
  font-size: 12px;
  line-height: 18px;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, 16px) scale(0.98);
  transition: opacity 160ms ease-in, transform 160ms cubic-bezier(0.4, 0, 1, 1);
  will-change: opacity, transform;
}

.duk-zoom-controls-visible {
  opacity: 1;
  pointer-events: auto;
  transform: translate(-50%, 0) scale(1);
  transition: opacity 140ms ease-out, transform 180ms cubic-bezier(0.22, 1, 0.36, 1);
}

.duk-zoom-controls-controlAnchor { display: flex; }
.duk-zoom-controls-zoomButton { width: 28px; padding: 0; flex: none; }
.duk-zoom-controls-percent { display: inline-flex; align-items: center; justify-content: center; gap: 2px; min-width: 58px; padding-inline: 6px; font-variant-numeric: tabular-nums; }
.duk-zoom-controls-zoomMenu { min-width: 112px; }

@media (hover: none), (pointer: coarse) {
  .duk-zoom-controls-panel {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, 0) scale(1);
  }
}

@media (prefers-reduced-motion: reduce) {
  .duk-zoom-controls-panel,
  .duk-zoom-controls-visible { transition-duration: 0.01ms; }
}

/* ===== separator/separator.css ===== */
.duk-separator {
  flex: none;
  background: var(--dsw-alias-border-l3);
}

.duk-separator-horizontal {
  width: 100%;
  height: 0.5px;
}

.duk-separator-vertical {
  width: 0.5px;
  align-self: stretch;
}

/* ===== aspect-ratio/aspect-ratio.css ===== */
.duk-aspect-ratio-aspectRatio {
  position: relative;
  width: 100%;
  overflow: hidden;
  border-radius: var(--dsw-radius-md);
}

.duk-aspect-ratio-aspectRatio > * {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ===== label/label.css ===== */
.duk-label {
  font: var(--dsw-font-s-14);
  color: var(--dsw-alias-label-primary);
  user-select: none;
}

/* ===== skeleton/skeleton.css ===== */
.duk-skeleton {
  border-radius: var(--dsw-radius-md);
  background: var(--dsw-alias-bg-skeleton);
  animation: duk-skeleton-skeleton-pulse 1.6s ease-in-out infinite;
}

@keyframes duk-skeleton-skeleton-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.45; }
}

@media (prefers-reduced-motion: reduce) {
  .duk-skeleton { animation: none; }
}

/* ===== progress/progress.css ===== */
.duk-progress {
  position: relative;
  overflow: hidden;
  height: 4px;
  border-radius: var(--dsw-radius-sm);
  background: var(--dsw-alias-bg-skeleton);
}

.duk-progress-indicator {
  width: 100%;
  height: 100%;
  border-radius: inherit;
  background: var(--dsw-alias-brand-primary);
  transform-origin: left;
  transition: transform 200ms ease;
}

.duk-progress-indeterminate .duk-progress-indicator {
  animation: duk-progress-progress-slide 1.4s ease-in-out infinite;
}

@keyframes duk-progress-progress-slide {
  0% { transform: translateX(-100%) scaleX(0.4); }
  50% { transform: translateX(30%) scaleX(0.4); }
  100% { transform: translateX(100%) scaleX(0.4); }
}

@media (prefers-reduced-motion: reduce) {
  .duk-progress-indeterminate .duk-progress-indicator { animation: none; }
}

/* ===== spinner/spinner.css ===== */
.duk-spinner {
  display: inline-block;
  flex: none;
  border: 1.5px solid var(--dsw-alias-border-l3);
  border-top-color: var(--dsw-alias-brand-primary);
  border-radius: 50%;
  animation: duk-spinner-spinner-rotate 700ms linear infinite;
}

@keyframes duk-spinner-spinner-rotate {
  to { transform: rotate(360deg); }
}

@media (prefers-reduced-motion: reduce) {
  .duk-spinner { animation-duration: 2s; }
}

/* ===== avatar/avatar.css ===== */
.duk-avatar {
  display: inline-flex;
  flex: none;
  overflow: hidden;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--dsw-alias-bg-layer-3);
  color: var(--dsw-alias-label-secondary);
  font-weight: 500;
  user-select: none;
}

.duk-avatar-image {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.duk-avatar-fallback {
  padding: 0 2px;
  line-height: 1;
}

/* ===== breadcrumb/breadcrumb.css ===== */
.duk-breadcrumb {
  font: var(--dsw-font-s-14);
}

.duk-breadcrumb-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 0;
  padding: 0;
  list-style: none;
  align-items: center;
}

.duk-breadcrumb-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.duk-breadcrumb-link {
  color: var(--dsw-alias-label-secondary);
  text-decoration: none;
  border-radius: var(--dsw-radius-sm);
}

.duk-breadcrumb-link:hover {
  color: var(--dsw-alias-label-primary);
  background: var(--dsw-alias-interactive-bg-hover);
}

.duk-breadcrumb-page {
  color: var(--dsw-alias-label-primary);
  font-weight: 500;
}

.duk-breadcrumb-separator {
  color: var(--dsw-alias-label-tertiary);
  user-select: none;
}

/* ===== button-group/button-group.css ===== */
.duk-button-group-buttonGroup {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.duk-button-group-buttonGroup > * {
  flex: none;
}

.duk-button-group-buttonGroup > * + * {
  margin-left: -0.5px;
}

/* ===== empty/empty.css ===== */
.duk-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 32px 24px;
  text-align: center;
}

.duk-empty-media {
  display: flex;
  color: var(--dsw-alias-label-tertiary);
}

.duk-empty-title {
  font: var(--dsw-font-m-18);
  color: var(--dsw-alias-label-primary);
}

.duk-empty-description {
  margin: 0;
  max-width: 360px;
  font: var(--dsw-font-s-14);
  color: var(--dsw-alias-label-secondary);
}

.duk-empty-content {
  margin-top: 8px;
}

/* ===== item/item.css ===== */
.duk-item {
  display: flex;
  gap: 12px;
  box-sizing: border-box;
  width: 100%;
  padding: 10px 12px;
  border-radius: var(--dsw-radius-md);
  background: var(--dsw-alias-bg-layer-1);
}

.duk-item-media {
  display: flex;
  flex: none;
  align-items: center;
  color: var(--dsw-alias-label-secondary);
}

.duk-item-content {
  display: flex;
  flex: 1 1 0;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.duk-item-title {
  font: var(--dsw-font-s-14);
  font-weight: 500;
  color: var(--dsw-alias-label-primary);
}

.duk-item-description {
  margin: 0;
  font: var(--dsw-font-xs-13);
  color: var(--dsw-alias-label-secondary);
}

.duk-item-actions {
  display: flex;
  flex: none;
  align-items: center;
  gap: 6px;
}

/* ===== field/field.css ===== */
.duk-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.duk-field-label {
  font: var(--dsw-font-s-14);
  color: var(--dsw-alias-label-primary);
  user-select: none;
}

.duk-field-description {
  margin: 0;
  font: var(--dsw-font-xs-13);
  color: var(--dsw-alias-label-secondary);
}

.duk-field-error {
  margin: 0;
  font: var(--dsw-font-xs-13);
  color: var(--dsw-alias-state-error-primary);
}

/* ===== card/card.css ===== */
.duk-card {
  display: flex;
  flex-direction: column;
  box-sizing: border-box;
  border: 0.5px solid var(--dsw-alias-border-l4);
  border-radius: var(--dsw-radius-panel);
  background: var(--dsw-alias-bg-layer-1);
}

.duk-card-header {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 18px 20px 8px;
}

.duk-card-title {
  margin: 0;
  font: var(--dsw-font-m-18);
  color: var(--dsw-alias-label-primary);
}

.duk-card-description {
  margin: 0;
  font: var(--dsw-font-s-14);
  color: var(--dsw-alias-label-secondary);
}

.duk-card-content {
  padding: 12px 20px;
}

.duk-card-footer {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 20px 18px;
}

/* ===== alert/alert.css ===== */
.duk-alert {
  display: flex;
  gap: 10px;
  box-sizing: border-box;
  width: 100%;
  padding: 12px 14px;
  border: 0.5px solid var(--dsw-alias-border-l4);
  border-left-width: 2px;
  border-radius: var(--dsw-radius-md);
  background: var(--dsw-alias-bg-layer-1);
  color: var(--dsw-alias-label-primary);
}

.duk-alert[data-variant='info'] { border-left-color: var(--dsw-alias-state-business-primary); }
.duk-alert[data-variant='success'] { border-left-color: var(--dsw-alias-state-success-primary); }
.duk-alert[data-variant='warning'] { border-left-color: var(--dsw-alias-state-warn-primary); }
.duk-alert[data-variant='danger'] { border-left-color: var(--dsw-alias-state-error-primary); }

.duk-alert-icon {
  display: flex;
  flex: none;
  padding-top: 1px;
  color: var(--dsw-alias-label-secondary);
}

.duk-alert[data-variant='success'] .duk-alert-icon { color: var(--dsw-alias-state-success-primary); }
.duk-alert[data-variant='warning'] .duk-alert-icon { color: var(--dsw-alias-state-warn-primary); }
.duk-alert[data-variant='danger'] .duk-alert-icon { color: var(--dsw-alias-state-error-primary); }
.duk-alert[data-variant='info'] .duk-alert-icon { color: var(--dsw-alias-state-business-primary); }

.duk-alert-body {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.duk-alert-title {
  margin: 0;
  font: var(--dsw-font-s-14);
  font-weight: 500;
}

.duk-alert-description {
  margin: 0;
  font: var(--dsw-font-xs-13);
  color: var(--dsw-alias-label-secondary);
}

/* ===== collapsible/collapsible.css ===== */
.duk-collapsible {
  border-radius: var(--dsw-radius-md);
  background: var(--dsw-alias-bg-layer-1);
}

.duk-collapsible-trigger {
  display: flex;
  gap: 6px;
  width: 100%;
  box-sizing: border-box;
  padding: 8px 10px;
  border: none;
  border-radius: inherit;
  background: transparent;
  cursor: pointer;
  font: var(--dsw-font-s-14);
  font-weight: 500;
  color: var(--dsw-alias-label-primary);
  text-align: left;
  align-items: center;
}

.duk-collapsible-trigger:hover {
  background: var(--dsw-alias-interactive-bg-hover);
}

.duk-collapsible-chevron {
  flex: none;
  width: 14px;
  height: 14px;
  color: var(--dsw-alias-label-tertiary);
  transition: transform 150ms ease;
}

.duk-collapsible[data-open] .duk-collapsible-chevron {
  transform: rotate(180deg);
}

.duk-collapsible-content {
  padding: 0 10px 10px 30px;
}

/* ===== accordion/accordion.css ===== */
.duk-accordion {
  border: 0.5px solid var(--dsw-alias-border-l4);
  border-radius: var(--dsw-radius-md);
  background: var(--dsw-alias-bg-layer-1);
  overflow: hidden;
}

.duk-accordion-item + .duk-accordion-item {
  border-top: 0.5px solid var(--dsw-alias-border-l4);
}

.duk-accordion-header {
  display: flex;
  gap: 8px;
  width: 100%;
  box-sizing: border-box;
  padding: 10px 12px;
  border: none;
  background: transparent;
  cursor: pointer;
  font: var(--dsw-font-s-14);

.duk-accordion-content {

.duk-accordion-contentInner {

@media (prefers-reduced-motion: reduce) {

/* ===== scroll-area/scroll-area.css ===== */

.duk-scroll-area-scrollArea::-webkit-scrollbar-thumb:hover {

.duk-scroll-area-scrollArea::-webkit-scrollbar-track {

/* ===== table/table.css ===== */

.duk-table-row:hover {

.duk-table-cell {

  border-bottom: 0.5px solid var(--dsw-alias-border-l4);
}

.duk-table-caption {
  margin-top: 8px;
  font: var(--dsw-font-xs-13);
  color: var(--dsw-alias-label-tertiary);
}

/* ===== data-table/data-table.css ===== */
.duk-data-table-headButton {
  padding: 0;
}

.duk-data-table-right {
  text-align: right;
}

.duk-data-table-sortButton {
  display: inline-flex;
  gap: 4px;
  align-items: center;
  padding: 8px 12px;
  border: none;
  background: transparent;
  cursor: pointer;
  font: inherit;
  font-weight: 500;
  color: var(--dsw-alias-label-secondary);
}

.duk-data-table-sortButton:hover {
  color: var(--dsw-alias-label-primary);
}

.duk-data-table-arrow {
  font-size: 10px;
  color: var(--dsw-alias-label-tertiary);
}

.duk-data-table-arrow[data-state='asc']::after { content: '↑'; }
.duk-data-table-arrow[data-state='desc']::after { content: '↓'; }

.duk-data-table-empty {
  padding: 24px 12px;
  text-align: center;

}

/* ===== toggle/toggle.css ===== */
.duk-toggle {
  display: inline-flex;
  gap: 6px;
  align-items: center;
  padding: 0 10px;
  height: 28px;
  border: 0.5px solid var(--dsw-alias-border-l3);
  border-radius: var(--dsw-radius-sm);
  background: var(--dsw-alias-bg-layer-1);
  cursor: pointer;
  font: var(--dsw-font-s-14);
  color: var(--dsw-alias-label-primary);
}

.duk-toggle[data-variant='ghost'] {
  border-color: transparent;
  background: transparent;
}

.duk-toggle:hover:not([aria-pressed='true']) {
  background: var(--dsw-alias-interactive-bg-hover);
}

.duk-toggle[aria-pressed='true'] {
  border-color: var(--dsw-alias-brand-primary);
  background: var(--dsw-alias-interactive-bg-hover-accent);
  color: var(--dsw-alias-brand-primary);
}

/* ===== toggle-group/toggle-group.css ===== */
.duk-toggle-group-group {
  display: inline-flex;
  gap: 4px;
  padding: 2px;
  border: 0.5px solid var(--dsw-alias-border-l4);
  border-radius: var(--dsw-radius-md);
  background: var(--dsw-alias-bg-layer-1);
}

.duk-toggle-group-item {
  padding: 0 10px;
  height: 24px;
  border: none;
  border-radius: var(--dsw-radius-sm);
  background: transparent;
  cursor: pointer;
  font: var(--dsw-font-xs-13);
  color: var(--dsw-alias-label-secondary);
}

.duk-toggle-group-item:hover {
  background: var(--dsw-alias-interactive-bg-hover);

}

.duk-toggle-group-item[aria-pressed='true'] {
  background: var(--dsw-alias-interactive-bg-hover-accent);
